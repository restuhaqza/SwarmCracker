          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }

  /v1/sandboxes/{id}/fork:
    post:
      operationId: forkSandbox
      summary: Fork clones of what a sandbox is running now
      description: >
        Requires sandboxes:checkpoints and a sandbox selector that names this sandbox.
        The node takes a fresh checkpoint of the running sandbox (the same quiesce,
        snapshot and publication a named checkpoint takes) under a minted name, forks the
        requested clones from it, and returns them. The checkpoint is not deleted: the
        response carries its name in checkpoint, and it is listed by GET /v1/checkpoints,
        because an image a caller cannot find is one it cannot free.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
