        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }

  /v1/nodes:
    get:
      operationId: listNodes
      summary: List nodes
      parameters:
        - name: label
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
          description: >
            Opaque cursor taken from a previous response's `next`. It is bound to
            the route and to the effective filter values that produced the page
            (the label selectors on routes that filter, the `task` reference on
            the flat snapshot routes); `limit` may change between pages. A
            cursor sent to a different query is 400 invalid with
            details.reason "cursor_mismatch", and a cursor this server did not
            issue is 400 invalid, with `details.cursor` carrying the rejected
            value.
      responses:
        "200":
          description: A page of nodes
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/NodeList" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/nodes/{id}:
    get:
      operationId: getNode
      summary: Get one node
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: A single node
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/NodeDocument" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
    patch:
      operationId: updateNode
      summary: Merge-patch a node's availability and labels
      description: >
        Requires nodes:write, which only the admin role holds. The body is an RFC
        7386 merge patch. `availability` (active, pause or drain) and `labels` are
        the only writable fields: `role`, `membership` and every read-envelope
        field are immutable and rejected with 400 invalid. If-Match is required.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: >
            Node reference: exact id, exact hostname, or a unique id prefix of at
            least 4 characters.
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
          description: >
            The revision from the last read. `*` matches any revision but the node
            must exist.
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/NodePatch" }
      responses:
        "200":
          description: The updated node
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/NodeDocument" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/audit:
    get:
      operationId: listAudit
      summary: List audit records
      description: >
        Manager-local, append-only audit records ordered by at then requestId,
        ascending. Requires the audit:read scope, which only the admin role
        grants. A manager that does not record an audit log answers 501 with
        details.capability "audit". Secret and config values are never recorded.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
          description: >
            Opaque cursor taken from a previous response's `next`. It is bound to
            the route and to the effective filter values that produced the page
            (the label selectors on routes that filter, the `task` reference on
            the flat snapshot routes); `limit` may change between pages. A
            cursor sent to a different query is 400 invalid with
            details.reason "cursor_mismatch", and a cursor this server did not
            issue is 400 invalid, with `details.cursor` carrying the rejected
            value.
      responses:
        "200":
          description: A page of audit records
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/AuditList" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          description: >
            This manager does not record an audit log. details.capability is
            "audit".
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/events:
    get:
      operationId: watchEvents
      summary: Stream resource changes
      description: >
        SSE by default; send Accept application/x-ndjson for one JSON object per
        line. The stream begins with a ready frame. The id/cursor is the watch
        batch boundary; every event in one batch shares it, so resuming may
        re-deliver that batch (at-least-once). Dedupe by resource and revision,
        not by cursor alone. Resume with `since` or `Last-Event-ID`. Requires
        events:read. An expired cursor is 410 cursor_expired with details.action
        "relist". Heartbeat comments are sent every 15 seconds on SSE.
        manager-local v1.
        Events also come from the node that serves them: a sandbox created,
        failed or removed through this node's API is streamed as
        `sandbox.created`, `sandbox.failed` or `sandbox.removed`, selectable
        with `types=sandbox`. A sandbox is not a SwarmKit object, so nothing
        watches it: those events carry no cursor (`cursor` is empty) and are
        live-only — a watcher receives them as they happen, and `since` does not
        resume across them. A fork's clones are `sandbox.created` too, one event
        per clone.
      parameters:
        - name: types
          in: query
          description: >-
            Comma-separated resource types: the cluster's service, task, node,
            network, config and secret, plus sandbox for this node's own sandbox
            events. Omitting it streams every type.
          schema:
            type: string
            example: service,task,node
        - name: since
          in: query
          description: Watch cursor to resume from.
          schema: { type: string }
        - name: label
          in: query
          description: Repeatable label selector.
          schema: { type: string }
        - name: include
          in: query
          description: Set to object to embed the mapped resource.
          schema: { type: string, enum: [object] }
      responses:
        "200":
          description: An event stream
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            text/event-stream:
              schema: { type: string }
            application/x-ndjson:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "410":
          description: The cursor is older than the retained watch log.
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        A bearer token minted on the manager with
        `swarmcracker api token create` and carrying the scope the route needs.
        Every TCP route requires one, including /v1/version. The trusted Unix
        socket needs no token: its file mode is the credential.
  responses:
    Unauthenticated:
      description: Missing or invalid bearer token
      headers:
        X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        WWW-Authenticate: { $ref: "#/components/headers/WWW-Authenticate" }
      content:
        application/vnd.swarmcracker.v1+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }
    NotModified:
      description: >
        The document is unchanged since the ETag sent in If-None-Match. The
        response has no body.
      headers:
        X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        ETag: { $ref: "#/components/headers/ETag" }
    RateLimited:
      description: >
        This token exceeded its request bucket. Retry-After is the number of
        seconds until the next token; the error code is rate_limited and
        retryable is true. A node that will not admit the work asked of it also
        answers 429, with code quota_exceeded, when its capacity or the caller's
        share of it is spent: the same Retry-After hint, plus details.resource,
        details.limit, details.used and details.requested, so a client can tell
        "slow down" from "there is no room, and here is what is using it".
      headers:
        X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Retry-After:
          description: Seconds until the next request may be attempted.
          schema: { type: integer, minimum: 1 }
      content:
        application/vnd.swarmcracker.v1+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }
    Forbidden:
      description: >
        The token lacks the scope this route requires (details.requiredScope), or
        its task selectors do not match (details.reason).
      headers:
        X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/vnd.swarmcracker.v1+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }
    BadRequest:
      description: >
        Invalid input: an unknown or immutable field, a bad enum, a malformed
        merge patch, an unresolvable reference, or a query parameter the route
        does not implement. The code is invalid for input the server cannot
        interpret and ambiguous when a reference matches more than one object;
        messages are not stable, the typed context is. details.fields names an
        offending body path.
        details.parameter names an unknown query parameter — every operation
        declares the parameters it accepts, and a name outside that set is a
        typo the server refuses rather than ignores (when several names are
        unknown, the lexicographically first is reported, so the answer is
        deterministic). details.reason names the specific rejection where the
        operation documents one: "cursor_mismatch" for a cursor issued for a
        different route or filter, "invalid_snapshot_id" for a snapshot id that
        is not a single safe path segment, "method_not_allowed",
        "payload_too_large" and "unsupported_media_type" for the 405/413/415
        shapes described on the Error schema, and the per-route reasons named in
        each operation's description.
      headers:
        X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Idempotency-Replayed:
          description: Present and true only when a retry replayed a stored 4xx.
          schema: { type: string, enum: ["true"] }
      content:
        application/vnd.swarmcracker.v1+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }
    NotFound:
      description: No resource matches the reference.
      headers:
        X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/vnd.swarmcracker.v1+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }
    Conflict:
      description: >
        A conflicting state: a duplicate name on create, a concurrent update the
        manager refused, or an Idempotency-Key problem. code is conflict. An
        idempotency failure names itself in details.reason: "idempotency_key_reuse"
        when the key was already used with a different body, and "in_progress"
        (with retryable: true and details.retryAfterMs: 250) while the first
        request with that key is still running.
      headers:
        X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Idempotency-Replayed:
          description: Present and true only when a retry replayed a stored 4xx.
          schema: { type: string, enum: ["true"] }
      content:
        application/vnd.swarmcracker.v1+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }
    PreconditionRequired:
      description: >
        The write needs If-Match. code is conflict and details.required is
        "If-Match".
      headers:
        X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/vnd.swarmcracker.v1+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }
    PreconditionFailed:
      description: >
        The If-Match revision is stale or weak, or the service is gone. code is
        conflict and details carries expectedRevision and currentRevision.
      headers:
        X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/vnd.swarmcracker.v1+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }
    PayloadTooLarge:
      description: >
        The body exceeds the route's limit: 8 MiB for a write document, 1 MiB
        for an exec request. code is invalid and details.reason is
        "payload_too_large".
      headers:
        X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/vnd.swarmcracker.v1+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }
    UnsupportedMediaType:
      description: >
        The request Content-Type is missing or not the one this route accepts.
        code is invalid and details.reason is "unsupported_media_type".
      headers:
        X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/vnd.swarmcracker.v1+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }
    MethodNotAllowed:
      description: >
        The path exists but does not serve this method. code is invalid and
        details.reason is "method_not_allowed"; the Allow header lists the methods
        it does serve. A network has no update, so PATCH and PUT on
        /v1/networks/{id} answer this with Allow: GET, DELETE.
      headers:
        X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Allow: { $ref: "#/components/headers/Allow" }
      content:
        application/vnd.swarmcracker.v1+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }
    NotImplemented:
      description: >
        The route exists but does not implement the requested capability. code is
        not_implemented and details.capability names it. A dry run on a rollback
        answers this: the previous spec is not the document that would be written.
        A `tty:true` exec also answers this, with details.reason
        "tty_not_supported": interactive exec over the API is a follow-up. Task
        exec, logs, files and attach answer this on a manager with no node
        broker, and so does a health-enriched task read: details.capability names
        the operation ("exec", "logs", "files", "health" or "attach") and there
        is no node path to serve it. Every snapshot route answers this on a manager that has not enabled
        the experimental capability, with details.capability "snapshots" and
        details.reason "snapshots_disabled", before the task is resolved or
        audited.
      headers:
        X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/vnd.swarmcracker.v1+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }
    ServiceUnavailable:
      description: >
        The manager cannot complete the request because a node is down or the
        node's guest agent is unavailable: code is unavailable. The operation
        may be retried; retryable is true when a retry can succeed. A node the
        manager cannot contact is unavailable, never unreachable: that code is
        reserved for a client's own failed dial. A single-task health read that
        cannot reach its node answers this: one document has no partial array to
        carry the failure.
      headers:
        X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/vnd.swarmcracker.v1+json:
          schema: { $ref: "#/components/schemas/ErrorDocument" }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
      description: >
        Manager-local create retry key. Trimmed; an empty value means no
        idempotency, and a value longer than 255 bytes or containing control
        characters is 400 invalid. Scope is the token, the method and the path, so
        two callers never collide. A replay returns the original status, headers
        and body plus `Idempotency-Replayed: true` and the current
        `X-Request-Id`. The same key with a different body is 409 conflict
        (`details.reason: "idempotency_key_reuse"`); the same key while the first
        request runs is 409 conflict (`details.reason: "in_progress"`,
        `retryable: true`, `details.retryAfterMs: 250`). State is in memory on the
        serving manager with a 24 h TTL; it is not replicated, so a retry after a
        leader change can create twice. A 5xx, a 428 missing If-Match, a 412
        stale precondition, and a malformed dryRun/wait/timeoutMs are not
        stored, so the corrected request may reuse the key. A replayed 4xx also
        carries `Idempotency-Replayed: true`. Ignored on a dry run, because a
        dry run persists nothing to replay.
    DryRun:
      name: dryRun
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: >
        Validate, resolve references and evaluate `If-Match` / `If-None-Match`
        without persisting. The response is the document that would have been
        written, with `dryRun: true`; a create preview has an empty id, revision
        and timestamps, and an update preview carries the current metadata. The
        precondition still applies: a stale `If-Match` is 412 and an existing name
        with `If-None-Match: *` is 409. A dry run writes no audit record. Only
        `true` and `false` are accepted.
    Wait:
      name: wait
      in: query
      required: false
      schema:
        type: string
        enum: [converged]
      description: >
        Service create, patch and rollback only. Hold the response until
        `status.converged` is true or `timeoutMs` expires. A timeout is not an
        error: the mutation committed, so the normal success status is returned
        with `status.converged: false` and `warnings: [{"code": "wait_timeout"}]`.
        A read failure while waiting is `warnings: [{"code": "wait_error", ...}]`
        with the last good document. Any other value is 400 invalid, and a wait
        on another write route is 400 invalid because only services converge.
        Cannot be combined with `dryRun`. Wait requests are exempt from the normal
        30 s request timeout and bounded only by `timeoutMs`.
    TimeoutMs:
      name: timeoutMs
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 600000
        default: 60000
      description: >
        Wait budget in milliseconds. Only valid with `wait=converged`; without it
        the request is 400 invalid. Default 60000, maximum 600000.
  headers:
    X-SwarmCracker-Api-Version:
      description: The API version that answered. Always 1 in phase 1.
      schema: { type: integer, enum: [1] }
    X-Request-Id:
      description: Per-request identifier; an error document repeats it as `requestId`.
      schema: { type: string }
    ETag:
      description: >
        A strong validator. For a single resource it is the quoted SwarmKit
        revision (`"17"`), the value If-Match expects; lists use the quoted
        SHA-256 of the response body. Send it back as If-None-Match to receive
        304 when nothing changed.
      schema: { type: string }
    WWW-Authenticate:
      description: Always `Bearer` on a 401.
      schema: { type: string }
    Allow:
      description: The methods this path serves, comma-separated, in registration order.
      schema: { type: string }
    Idempotency-Replayed:
      description: >
        Present and `true` only on a response replayed from an Idempotency-Key
        store. The first response never carries it. The body, status and contract
        headers are the originals; `X-Request-Id` is the current request's.
      schema: { type: string, enum: ["true"] }

  schemas:
    NetworkIPAM:
      type: object
      properties:
        subnet: { type: string }
        gateway: { type: string }

    Network:
      type: object
      required: [id, name, revision]
      properties:
        id: { type: string }
        name: { type: string }
        revision: { type: string }
        createdAt: { type: string, format: date-time }
        driver: { type: string }
        ipam: { $ref: "#/components/schemas/NetworkIPAM" }
        labels:
          type: object
          additionalProperties: { type: string }
        attachable: { type: boolean }

    NetworkList:
      type: object
      required: [schemaVersion, kind, items, next]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        kind: { type: string, enum: [NetworkList] }
        items:
          type: array
          items: { $ref: "#/components/schemas/Network" }
        next:
          type: [string, "null"]

    NetworkDocument:
      allOf:
        - $ref: "#/components/schemas/Network"
        - type: object
          required: [schemaVersion, kind]
          properties:
            schemaVersion: { type: integer, enum: [1] }
            kind: { type: string, enum: [Network] }
            dryRun:
              type: boolean
              description: Present and true only on the response to a dry-run write.

    Config:
      type: object
      required: [id, name, revision]
      properties:
        id: { type: string }
        name: { type: string }
        revision: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        labels:
          type: object
          additionalProperties: { type: string }
        data:
          type: string
          description: >
            Config payload, UTF-8 text. Present only when the caller holds
            configs:read-values; a plain configs:read response omits the field
            entirely (it is never sent empty). It is absent when the config has no
            payload, and when the config was stored out of band with a non-UTF-8
            payload: the API does not transcode bytes to U+FFFD. A secret never
            has a data field on any read path.

    ConfigList:
      type: object
      required: [schemaVersion, kind, items, next]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        kind: { type: string, enum: [ConfigList] }
        items:
          type: array
          items: { $ref: "#/components/schemas/Config" }
        next:
          type: [string, "null"]

    ConfigDocument:
      allOf:
        - $ref: "#/components/schemas/Config"
        - type: object
          required: [schemaVersion, kind]
          properties:
            schemaVersion: { type: integer, enum: [1] }
            kind: { type: string, enum: [Config] }
            dryRun:
              type: boolean
              description: Present and true only on the response to a dry-run write.

    Secret:
      type: object
      required: [id, name, revision]
      properties:
        id: { type: string }
        name: { type: string }
        revision: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        labels:
          type: object
          additionalProperties: { type: string }
        driver: { type: string }

    SecretList:
      type: object
      required: [schemaVersion, kind, items, next]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        kind: { type: string, enum: [SecretList] }
        items:
          type: array
          items: { $ref: "#/components/schemas/Secret" }
        next:
          type: [string, "null"]

    SecretDocument:
      allOf:
        - $ref: "#/components/schemas/Secret"
        - type: object
          required: [schemaVersion, kind]
          properties:
            schemaVersion: { type: integer, enum: [1] }
            kind: { type: string, enum: [Secret] }
            dryRun:
              type: boolean
              description: Present and true only on the response to a dry-run write.

    ConfigWrite:
      type: object
      required: [name]
      description: >
        The POST /v1/configs body. `data` is UTF-8 text; a payload that is not
        valid UTF-8 is refused with details.reason "binary_not_supported".
      properties:
        name: { type: string, minLength: 1 }
        labels:
          type: object
          additionalProperties: { type: string }
        data:
          type: string
          description: UTF-8 payload, opaque to the API.

    ConfigPatch:
      type: object
      additionalProperties: false
      description: >
        An RFC 7386 merge patch over a config. `labels` is the only writable
        field: data, name, id, revision, the timestamps, schemaVersion and kind are
        immutable. null clears every label and a null value deletes one key.
      properties:
        labels:
          type: [object, "null"]
          additionalProperties: { type: [string, "null"] }

    SecretDriver:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        options:
          type: object
          additionalProperties: { type: string }

    SecretWrite:
      type: object
      required: [name]
      description: >
        The POST /v1/secrets body. Exactly one of `data` (base64) or `driver` must
        be present; both or neither is 400 invalid. No response ever echoes the
        payload.
      oneOf:
        - required: [data]
        - required: [driver]
      properties:
        name: { type: string, minLength: 1 }
        labels:
          type: object
          additionalProperties: { type: string }
        data:
          type: string
          format: byte
          writeOnly: true
          description: >
            Base64-encoded payload. Standard base64 with or without RFC 4648
            padding is accepted. Never returned on any read path.
        driver: { $ref: "#/components/schemas/SecretDriver" }

    SecretPatch:
      type: object
      additionalProperties: false
      description: >
        An RFC 7386 merge patch over a secret. `labels` is the only writable
        field: data, driver, name, id, revision, the timestamps, schemaVersion and
        kind are immutable.
      properties:
        labels:
          type: [object, "null"]
          additionalProperties: { type: [string, "null"] }

    NetworkWrite:
      type: object
      required: [name]
      description: >
        The POST /v1/networks body. The driver defaults to "overlay". The IPAM
        subnet must be a network address in CIDR form (10.0.1.0/24, not
        10.0.1.7/24), the gateway must sit inside it, and neither the network
        address nor the IPv4 broadcast address is a usable gateway. There is no
        update, so driver, IPAM and labels are fixed at create.
      properties:
        name: { type: string, minLength: 1 }
        driver: { type: string, default: overlay }
        ipam: { $ref: "#/components/schemas/NetworkIPAM" }
        labels:
          type: object
          additionalProperties: { type: string }
        attachable: { type: boolean }

    NodePatch:
      type: object
      additionalProperties: false
      description: >
        An RFC 7386 merge patch over a node. `availability` and `labels` are the
        only writable fields; role, membership and the read-envelope fields are
        immutable. Availability is not nullable: it is a required enum.
      properties:
        availability: { type: string, enum: [active, pause, drain] }
        labels:
          type: [object, "null"]
          additionalProperties: { type: [string, "null"] }

    ServiceList:
      type: object
      required: [schemaVersion, kind, items, next]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        kind: { type: string, enum: [ServiceList] }
        items:
          type: array
          items: { $ref: "#/components/schemas/Service" }
        next:
          type: [string, "null"]
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Warning" }
        partial:
          type: array
          items: { $ref: "#/components/schemas/Partial" }

    ServiceDocument:
      allOf:
        - $ref: "#/components/schemas/Service"
        - type: object
          required: [schemaVersion, kind]
          properties:
            schemaVersion: { type: integer, enum: [1] }
            kind: { type: string, enum: [Service] }
            dryRun:
              type: boolean
              description: >
                Present and true only on the response to a dry-run create or
                patch: the document was validated but not persisted.
            warnings:
              type: array
              description: >
                Non-fatal outcomes of a wait. `wait_timeout` means the mutation
                committed but the service did not converge within `timeoutMs`;
                `wait_error` means a read failed while waiting and the document is
                the last good one.
              items: { $ref: "#/components/schemas/Warning" }

    Service:
      type: object
      required: [id, name, revision, spec, status]
      properties:
        id: { type: string }
        name: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        revision: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        spec: { $ref: "#/components/schemas/ServiceSpec" }
        status: { $ref: "#/components/schemas/ServiceStatus" }

    ServiceSpec:
      type: object
      required: [mode, task]
      properties:
        mode: { type: string, enum: [replicated, global, replicated-job, global-job, unknown] }
        replicas:
          type: [integer, "null"]
          format: int64
        task: { $ref: "#/components/schemas/TaskSpec" }
        update: { $ref: "#/components/schemas/UpdateConfig" }
        rollback: { $ref: "#/components/schemas/UpdateConfig" }
        placement: { $ref: "#/components/schemas/Placement" }

    TaskSpec:
      type: object
      required: [image]
      properties:
        image: { type: string }
        command: { type: array, items: { type: string } }
        args: { type: array, items: { type: string } }
        env:
          type: object
          additionalProperties: { type: string }
        user: { type: string }
        workdir: { type: string }
        vcpus: { type: integer, format: int64 }
        memoryBytes: { type: integer, format: int64 }
        ports:
          type: array
          items: { $ref: "#/components/schemas/Port" }
        mounts:
          type: array
          items: { $ref: "#/components/schemas/Mount" }
        networks:
          type: array
          items: { $ref: "#/components/schemas/NetworkAttachment" }
        restartPolicy: { $ref: "#/components/schemas/RestartPolicy" }
        healthcheck: { $ref: "#/components/schemas/Healthcheck" }
        stopSignal: { type: string }
        stopGraceMs: { type: integer, format: int64 }
        readOnlyRootfs: { type: boolean }

    ServiceWrite:
      type: object
      required: [name, spec]
      description: >
        The POST /v1/services body. Separate from Service so the write-only
        registry credential can never appear on a response. `spec.task.env` keys
        must not contain "=" or surrounding whitespace, and a `bind` mount
        requires the admin role.
      properties:
        name: { type: string, minLength: 1 }
        labels:
          type: object
          additionalProperties: { type: string }
        spec: { $ref: "#/components/schemas/ServiceSpecWrite" }

    ServiceSpecWrite:
      type: object
      required: [task]
      properties:
        mode:
          type: string
          enum: [replicated, global]
          default: replicated
          description: Immutable after create.
        replicas:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: >
            Only valid for mode replicated. Omitted or null means 1. A global
            service must not carry it.
        task: { $ref: "#/components/schemas/TaskSpecWrite" }
        update: { $ref: "#/components/schemas/UpdateConfig" }
        rollback: { $ref: "#/components/schemas/UpdateConfig" }
        placement: { $ref: "#/components/schemas/Placement" }

    TaskSpecWrite:
      allOf:
        - $ref: "#/components/schemas/TaskSpec"
        - type: object
          properties:
            registryAuth:
              type: string
              writeOnly: true
              description: >
                The base64 X-Registry-Auth payload SwarmKit hands the node when
                it pulls the image. Write-only: it is never present on a response.
                Absent on a patch preserves the existing credential; null clears
                it.

    ServicePatch:
      type: object
      additionalProperties: false
      description: >
        An RFC 7386 merge patch over the writable service subtree. null resets an
        optional scalar to its default, null on a map key deletes that key, and an
        empty array clears an array. id, name, revision, timestamps, status and
        spec.mode are immutable and rejected.
      properties:
        labels:
          type: [object, "null"]
          additionalProperties: { type: [string, "null"] }
        spec: { $ref: "#/components/schemas/ServiceSpecPatch" }

    ServiceSpecPatch:
      type: object
      additionalProperties: false
      properties:
        replicas:
          type: [integer, "null"]
          format: int64
          minimum: 0
        task: { $ref: "#/components/schemas/TaskSpecPatch" }
        update:
          anyOf:
            - $ref: "#/components/schemas/UpdateConfig"
            - type: "null"
        rollback:
          anyOf:
            - $ref: "#/components/schemas/UpdateConfig"
            - type: "null"
        placement:
          anyOf:
            - $ref: "#/components/schemas/Placement"
            - type: "null"

    TaskSpecPatch:
      type: object
      additionalProperties: false
      properties:
        image: { type: string }
        command:
          type: [array, "null"]
          items: { type: string }
        args:
          type: [array, "null"]
          items: { type: string }
        env:
          type: [object, "null"]
          additionalProperties: { type: [string, "null"] }
        user: { type: [string, "null"] }
        workdir: { type: [string, "null"] }
        vcpus: { type: [integer, "null"], format: int64, minimum: 0 }
        memoryBytes: { type: [integer, "null"], format: int64, minimum: 0 }
        ports:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/Port" }
        mounts:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/Mount" }
        networks:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/NetworkAttachment" }
        restartPolicy:
          anyOf:
            - $ref: "#/components/schemas/RestartPolicy"
            - type: "null"
        healthcheck:
          anyOf:
            - $ref: "#/components/schemas/Healthcheck"
            - type: "null"
          description: >
            Merged field by field; null removes it. An explicitly empty `test`
            array also clears the whole healthcheck (SwarmKit would read an empty
            test as "inherit").
        stopSignal: { type: [string, "null"] }
        stopGraceMs: { type: [integer, "null"], format: int64, minimum: 0 }
        readOnlyRootfs: { type: [boolean, "null"] }
        registryAuth:
          type: [string, "null"]
          writeOnly: true
          description: >
            Write-only. Absent preserves the existing pull credential, null
            clears it, a string replaces it.

    Port:
      type: object
      required: [target]
      properties:
        target: { type: integer, minimum: 0, maximum: 65535 }
        published: { type: integer, minimum: 0, maximum: 65535 }
        protocol: { type: string, enum: [tcp, udp, sctp] }
        mode: { type: string, enum: [ingress, host] }

    Mount:
      type: object
      required: [type, target]
      properties:
        type:
          type: string
          enum: [bind, volume, tmpfs, npipe, cluster]
          description: >
            v1 writes accept every SwarmKit mount type. `bind` references a host
            path and requires the admin role (contract §5.3): an operator token is
            refused with 403 forbidden and details.requiredRole "admin". `npipe`
            and `cluster` are additive extensions to the contract's
            volume/bind/tmpfs set.
        source: { type: string }
        target: { type: string }
        readOnly: { type: boolean }

    NetworkAttachment:
      type: object
      required: [id]
      properties:
        id: { type: string }
        name: { type: string }
        aliases: { type: array, items: { type: string } }

    RestartPolicy:
      type: object
      properties:
        condition: { type: string, enum: [none, on-failure, any] }
        delayMs: { type: integer, format: int64 }
        maxAttempts: { type: integer, format: uint64 }
        windowMs: { type: integer, format: int64 }

    Healthcheck:
      type: object
      required: [test]
      properties:
        test: { type: array, items: { type: string } }
        intervalMs: { type: integer, format: int64 }
        timeoutMs: { type: integer, format: int64 }
        retries: { type: integer, format: int64 }
        startPeriodMs: { type: integer, format: int64 }

    UpdateConfig:
      type: object
      properties:
        parallelism: { type: integer, format: uint64 }
        delayMs: { type: integer, format: int64 }
        failureAction: { type: string, enum: [pause, continue, rollback] }
        order: { type: string, enum: [stop-first, start-first] }
        monitorMs: { type: integer, format: int64 }
        maxFailureRatio: { type: number, format: float }

    Placement:
      type: object
      properties:
        constraints: { type: array, items: { type: string } }

    ServiceStatus:
      type: object
      required: [desiredTasks, runningTasks, tasksInTransition, converged]
      properties:
        desiredTasks: { type: integer }
        runningTasks: { type: integer }
        tasksInTransition: { type: integer }
        converged: { type: boolean }
        message: { type: string }
        endpoint: { $ref: "#/components/schemas/Endpoint" }

    Endpoint:
      type: object
      properties:
        ports:
          type: array
          items: { $ref: "#/components/schemas/Port" }

    TaskList:
      type: object
      required: [schemaVersion, kind, items, next]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        kind: { type: string, enum: [TaskList] }
        items:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        next:
          type: [string, "null"]
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Warning" }
        partial:
          type: array
          items: { $ref: "#/components/schemas/Partial" }

    Task:
      type: object
      required: [id, revision, serviceId, state, desiredState]
      properties:
        id: { type: string }
        name: { type: string }
        revision: { type: string }
        serviceId: { type: string }
        serviceName: { type: string }
        nodeId: { type: string }
        nodeName: { type: string }
        slot: { type: integer, format: int64 }
        state: { type: string }
        desiredState: { type: string }
        message: { type: string }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        image: { type: string }
        addresses: { type: array, items: { type: string } }
        ports:
          type: array
          items: { $ref: "#/components/schemas/Port" }
        exitCode: { type: integer, format: int32 }
        health: { $ref: "#/components/schemas/TaskHealth" }

    TaskHealth:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [starting, healthy, failing, unhealthy] }
        failingStreak: { type: integer }
        output: { type: string }
        command: { type: string }
        checkedAt: { type: string, format: date-time }

    TaskDocument:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          required: [schemaVersion, kind]
          properties:
            schemaVersion: { type: integer, enum: [1] }
            kind: { type: string, enum: [Task] }

    Snapshot:
      type: object
      required: [id]
      description: >
        One VM snapshot. Only `rootfsPath` is published: the memory and state
        files are node-local and never cross the wire, and so is the snapshot's
        own copy of the task disk. The copy path is recorded in the node's
        metadata.json (as disk_path), which is the only record of a snapshot and
        is never a wire field. `sizeBytes` is the total footprint on the node:
        the memory image, the state file and the disk copy, so it is
        approximately memoryMB plus the task disk size. `memoryMB` is camel-cased
        to match the contract even though the engine's internal field is
        MemoryMB. Every field except `id` is optional, so a node that recorded
        less metadata still produces a valid document.
      properties:
        id: { type: string, pattern: "^snap-[A-Za-z0-9]+$" }
        taskId: { type: string }
        serviceId: { type: string }
        nodeId: { type: string }
        createdAt: { type: string, format: date-time }
        sizeBytes:
          type: integer
          format: int64
          description: >
            Total bytes the snapshot occupies on its node: memory image, state
            file and the disk copy.
        memoryMB: { type: integer }
        vcpuCount: { type: integer }
        rootfsPath:
          type: string
          description: >
            The absolute task rootfs path the snapshot was taken from. Restore
            puts the snapshot's disk copy back at this path when the task disk
            is gone.
        checksum: { type: string }

    SnapshotDocument:
      allOf:
        - $ref: "#/components/schemas/Snapshot"
        - type: object
          required: [schemaVersion, kind]
          properties:
            schemaVersion: { type: integer, enum: [1] }
            kind: { type: string, enum: [Snapshot] }

    SnapshotList:
      type: object
      required: [schemaVersion, kind, items, next]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        kind: { type: string, enum: [SnapshotList] }
        items:
          type: array
          items: { $ref: "#/components/schemas/Snapshot" }
        next:
          type: [string, "null"]
        partial:
          type: array
          items: { $ref: "#/components/schemas/Partial" }

    SnapshotCreateRequest:
      type: object
      description: >
        The optional body of POST /v1/tasks/{id}/snapshots. Every field is
        optional and unknown fields are rejected. An empty body is valid: the node
        snapshots the VM with the resources it is running with.
      additionalProperties: false
      properties:
        vcpus:
          type: integer
          minimum: 0
          description: vCPUs to record for the snapshot.
        memoryMB:
          type: integer
          minimum: 0
          description: Memory in MiB to record for the snapshot.
        rootfsPath:
          type: string
          description: >
            Absolute rootfs path to record for the snapshot. A relative path or
            one containing a `..` segment is 400 invalid. Redundant separators, a
            trailing slash and `.` segments all name the same absolute directory
            and are accepted.

    MigrationRequest:
      type: object
      description: >
        The body of POST /v1/migrations: the task to move and the node to move it
        to. `taskId` is an exact task ID, not a reference the manager resolves, so a
        prefix or a name is 404 not_found. `targetNode` is a reference the manager
        resolves (exact id, hostname, or a unique id prefix of at least four
        characters). Both are required, and unknown fields are rejected.
      additionalProperties: false
      required: [taskId, targetNode]
      properties:
        taskId:
          type: string
          description: >
            The exact ID of the task whose VM moves; a prefix or a name is 404. It must
            be running and belong to a replicated service with exactly one replica.
        targetNode:
          type: string
          description: >
            The node to move the task to. Accepts an exact node id, an exact hostname,
            or a unique id prefix of at least four characters; a prefix that matches
            more than one node is 400 ambiguous with details.candidates. It must not
            be the node the task already runs on, and it must be ready and active.

    MigrationPhase:
      type: object
      description: >
        One step of a migration report. `result` is "ok" for a phase that finished,
        "error" for the phase that failed (the request then answers a typed error
        document with details.phase), and "pending" for a verify that ran out of
        time while the replacement was still starting.
      additionalProperties: false
      required: [name, startedAt, result]
      properties:
        name:
          type: string
          enum: [validate, export, relay, prepare, replace, verify, cleanup]
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        result:
          type: string
          enum: [ok, error, pending]
        message:
          type: string
          description: >
            Why a non-ok phase ended that way, or which best-effort cleanup step did
            not complete. It is a step name plus the failure's stable code and details
            reason (for example "discard the artifact on the source: unavailable
            (artifact_unremovable)"), never the failure's text: that text is written by
            this node or a peer and names node-local paths.

    Migration:
      type: object
      description: >
        The report of one migration. `id` is the artifact the source exported - a
        migration has no identity beyond the artifact that carries the VM - and
        `downtimeMs` is measured from the instant the old task was observed gone
        (or, if it was never observed gone, from the instant the service update
        returned) to the first instant a replacement reported running on the target.
        It is zero for an outcome that never saw a running replacement, because an
        unmeasured downtime is not zero seconds.
      additionalProperties: false
      required:
        [schemaVersion, kind, id, taskId, sourceNode, targetNode, phases, downtimeMs, outcome]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        kind: { type: string, enum: [Migration] }
        id: { type: string, pattern: "^mig-[0-9a-f]{16}$" }
        taskId: { type: string }
        serviceId: { type: string }
        sourceNode: { type: string }
        targetNode: { type: string }
        phases:
          type: array
          items: { $ref: "#/components/schemas/MigrationPhase" }
        downtimeMs:
          type: integer
          format: int64
          minimum: 0
        outcome:
          type: string
          enum: [moved, pending]

    ExecRequest:
      type: object
      required: [command]
      properties:
        command:
          type: array
          minItems: 1
          items: { type: string }
          description: >
            The argv to run. Required and non-empty; the first element is the
            executable.
        env:
          type: object
          additionalProperties: { type: string }
          description: >
            Environment variables for the command. A key must be non-empty and
            must not contain "="; values are sent to the guest as K=V after
            stable sorting. Audit records never carry them.
        workdir:
          type: string
          description: Working directory, passed through; the guest validates it.
        tty:
          type: boolean
          default: false
          description: >
            Request a pseudo-terminal. Always 501 not_implemented over HTTP
            (details.reason "tty_not_supported").
        stdin:
          type: boolean
          default: false
          description: >
            Attach stdin. Requires tty, so over HTTP it is 400 invalid with
            details.reason "stdin_requires_tty".
        timeoutMs:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: >
            Server-side deadline for the whole command in milliseconds. 0 means
            no server-side deadline. A negative value is 400 invalid.

    ExecFrame:
      type: object
      required: [type]
      description: >
        One frame of the exec stream: exactly one JSON object per line, newline
        terminated. The stream ends with one `exit` frame, or with one `error`
        frame when the command failed after it started.
      properties:
        type:
          type: string
          enum: [stdout, stderr, exit, error]
        data:
          type: string
          format: byte
          description: >
            Base64-encoded raw output bytes from the guest. Set on stdout and
            stderr frames.
        exitCode:
          type: integer
          description: >
            Process status on an exit frame. When the guest was killed by signal
            N this is 128+N.
        signal:
          type: integer
          description: >
            The terminating signal number on an exit frame; absent for a normal
            exit.
        code:
          type: string
          description: >
            Error code on an error frame: "internal" for a mid-stream failure,
            "timeout" when the deadline expired.

    LogFrame:
      type: object
      required: [type]
      description: >
        One frame of a task log stream: exactly one JSON object per line, newline
        terminated. A non-following stream ends with one `eof` frame; a following
        stream has no terminal frame. The console log merges stdout and stderr,
        so `stream` is always stdout.
      properties:
        type:
          type: string
          enum: [log, eof]
        stream:
          type: string
          enum: [stdout]
          description: The merged console stream. Set on log frames only.
        time:
          type: string
          format: date-time
          description: >
            RFC3339Nano timestamp. An approximation: the console file has no
            per-line timestamps, so backlog lines carry the file's modification
            time and followed lines carry the time they were read.
        data:
          type: string
          format: byte
          description: Base64-encoded raw console bytes. Set on log frames only.

    NodeList:
      type: object
      required: [schemaVersion, kind, items, next]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        kind: { type: string, enum: [NodeList] }
        items:
          type: array
          items: { $ref: "#/components/schemas/Node" }
        next:
          type: [string, "null"]
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Warning" }
        partial:
          type: array
          items: { $ref: "#/components/schemas/Partial" }

    Node:
      type: object
      required: [id, revision, role, membership, availability, state]
      properties:
        id: { type: string }
        hostname: { type: string }
        revision: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        role: { type: string }
        membership: { type: string }
        availability: { type: string }
        state: { type: string }
        address: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        resources: { $ref: "#/components/schemas/NodeResources" }
        manager: { $ref: "#/components/schemas/NodeManager" }
        agentVersion: { type: string }

    NodeResources:
      type: object
      properties:
        cpus: { type: number, format: double }
        memoryBytes: { type: integer, format: int64 }

    NodeManager:
      type: object
      required: [leader, reachable]
      properties:
        leader: { type: boolean }
        reachable: { type: boolean }
        address: { type: string }
        raftId: { type: integer, format: int64 }

    NodeDocument:
      allOf:
        - $ref: "#/components/schemas/Node"
        - type: object
          required: [schemaVersion, kind]
          properties:
            schemaVersion: { type: integer, enum: [1] }
            kind: { type: string, enum: [Node] }
            dryRun:
              type: boolean
              description: Present and true only on the response to a dry-run write.

    Warning:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }

    Partial:
      type: object
      required: [nodeId, error]
      properties:
        nodeId: { type: string }
        nodeName: { type: string }
        error:
          allOf:
            - $ref: "#/components/schemas/Error"
            - type: object
              required: [requestId]
          description: >
            A complete Error object. Unlike a top-level Error, requestId is
            required here: a partial is tied to the request that produced it.

    ErrorDocument:
      type: object
      required: [schemaVersion, kind, error]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        kind: { type: string, enum: [Error] }
        error: { $ref: "#/components/schemas/Error" }

    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum:
            - invalid
            - ambiguous
            - not_found
            - unauthenticated
            - forbidden
            - conflict
            - cursor_expired
            - rate_limited
            - quota_exceeded
            - unavailable
            - timeout
            - unsupported_version
            - not_implemented
            - internal
            - usage
            - unreachable
        message: { type: string }
        requestId: { type: string }
        retryable: { type: boolean }
        details:
          type: object
          additionalProperties: true
          description: >
            Typed failure context. When details.fields is present it maps an
            offending path to a reason. details.parameter names an unknown query
            parameter. details.cursor carries the value of a cursor this server
            did not issue (a malformed or truncated cursor). details.reason names
            a specific rejection, for example "cursor_mismatch" (a cursor from a
            different route or filter — the value is not echoed back),
            "invalid_snapshot_id" (a snapshot id that is not one safe path
            segment), "no_restored_vm", or "migration_in_flight" (another
            migration of the same service is already running). A migration
            failure also carries details.phase, the step that failed. 405, 413 and
            415 keep code `invalid` and put `method_not_allowed`,
            `payload_too_large` or `unsupported_media_type` in details.reason.
            A refusal of admission (429 `quota_exceeded`) carries
            details.resource, which limit was reached (`sandboxes_per_owner`,
            the sandboxes one owner holds; `node_memory_mb` or `node_disk_mb`,
            the node's own capacity), details.limit, details.used and
            details.requested in that resource's unit — sandboxes for a
            per-owner limit, MiB for the node's memory and disk — details.owner
            when the limit is an owner's, and details.retryAfterMs, the same
            hint as the Retry-After header.

    VersionInfo:
      type: object
      required:
        [schemaVersion, kind, apiVersions, serverVersion, grpcProtocolVersion, capabilities]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        kind: { type: string, enum: [VersionInfo] }
        apiVersions:
          type: array
          items: { type: string }
        serverVersion: { type: string }
        grpcProtocolVersion: { type: string }
        clusterId: { type: string }
        capabilities:
          type: array
          items: { type: string }
          description: >
            Feature detection. read, write and events are always served. exec,
            logs, files, health and attach are advertised only when the manager
            has a node broker wired, because they are relayed to the node that
            runs the task. snapshots is advertised only when the experimental
            snapshot surface is enabled. migrations is advertised only when the
            manager has both a node broker and its migration spool, because a
            migration is relayed and spooled. sandboxes is advertised only when the
            node serves a sandbox control plane (sandboxd), because the sandbox
            routes are that daemon's. A capability that is advertised is
            served; the version document never promises a route that answers 501.

    AuditActor:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [token, local, unknown]
          description: >
            token for a bearer-authenticated TCP request, local for the trusted
            Unix socket where the file mode is the credential, and unknown when
            the record was produced without a request identity.
        id: { type: string }
        name: { type: string }

    AuditResource:
      type: object
      required: [kind]
      properties:
        kind: { type: string }
        id: { type: string }
        name: { type: string }

    EventResource:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          description: >-
            The resource's kind: Service, Task, Node, Network, Config, Secret or
            Sandbox.
        id: { type: string }
        name: { type: string }
    Event:
      type: object
      required: [schemaVersion, kind, cursor, type, resource]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        kind: { type: string, enum: [Event] }
        cursor:
          type: string
          description: >-
            The watch batch boundary of a cluster event; every event in one
            batch shares it. Empty for a node-local event (a sandbox change),
            which is live-only and cannot be resumed from.
        at: { type: string, format: date-time }
        type:
          type: string
          description: "<resource>.<created|updated|removed|failed>"
        resource: { $ref: "#/components/schemas/EventResource" }
        revision: { type: string }
        changed:
          type: array
          items: { type: string }
        actor: { $ref: "#/components/schemas/AuditActor" }
        object:
          type: object
          additionalProperties: true
    AuditRecord:
      type: object
      required: [at, requestId, actor, action, resource, result]
      properties:
        at: { type: string, format: date-time }
        requestId: { type: string }
        actor: { $ref: "#/components/schemas/AuditActor" }
        action: { type: string }
        resource: { $ref: "#/components/schemas/AuditResource" }
        result:
          type: string
          enum: [ok, error]
        precondition:
          type: string
          enum: [revision, any]
          description: >
            How the write's If-Match was satisfied: revision for an exact
            revision, any for `If-Match: "*"`. Absent when the write carried no
            precondition.
        sourceIp:
          type: string
          description: >
            The TCP peer address, host only. Absent for a Unix-socket request.
            A forwarded header is never used.

    AuditList:
      type: object
      required: [schemaVersion, kind, items, next]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        kind: { type: string, enum: [AuditList] }
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditRecord" }
        next:
          type: [string, "null"]

    Sandbox:
      type: object
      required: [id, state]
      description: >
        One agent sandbox: a microVM booted from a sealed template, with its own
        disk, its own network namespace and its own per-boot credential. Host
        layout — the jail, the disk path, the agent-token path — is deliberately
        absent: what crosses the API is what a caller acts on.
      properties:
        id: { type: string }
        state:
          type: string
          enum: [created, ready, failed, stopped]
          description: >
            created is a sandbox being built (or a create that died), ready is one
            whose guest agent answered its hello — the only state in which it can
            run a command — failed is one the node could not make usable or lost
            (reason says which), and stopped is one the node has ended. A removed
            sandbox is not listed: its record is deleted once everything it held is
            freed.
        template: { type: string, description: "The resolved template reference, name@version." }
        owner: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        readyAt:
          type: string
          format: date-time
          description: When the guest agent answered. Absent until it does.
        lastActiveAt:
          type: string
          format: date-time
          description: When the node last saw the sandbox used; the idle TTL is measured from it.
        idleTtlSeconds:
          type: integer
          minimum: 0
          description: How long the sandbox may sit unused before the reaper takes it back. 0 means never.
        reason: { type: string, description: Why a sandbox is failed. Absent in every other state. }
        guestIp: { type: string }
        mac: { type: string }
        egress:
          type: array
          items: { type: string }
          description: The allowlist the sandbox was created with, as requested; empty is egress none.
        diskCopy:
          type: string
          enum: [reflink, sparse, full]
          description: How the sandbox's own disk was materialized from the template.
        agentVersion: { type: string }
        bootId: { type: string }

    SandboxList:
      type: object
      required: [schemaVersion, kind, items, next]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        kind: { type: string, enum: [SandboxList] }
        items:
          type: array
          items: { $ref: "#/components/schemas/Sandbox" }
        next:
          type: [string, "null"]
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Warning" }
        checkpoint:
          type: string
          description: >
            The checkpoint these sandboxes were forked from. Set by the fork routes,
            which either take a checkpoint themselves (and mint its name) or are given
            one: a caller that cannot see the name cannot free the image the fork left
            behind.

    SandboxDocument:
      allOf:
        - $ref: "#/components/schemas/Sandbox"
        - type: object
          required: [schemaVersion, kind]
          properties:
            schemaVersion: { type: integer, enum: [1] }
            kind: { type: string, enum: [Sandbox] }

    SandboxCreate:
      type: object
      required: [template]
      properties:
        template:
          type: string
          description: >
            The sealed template to boot, by name (newest version) or name@version.
            Resolved and pin-checked on the node before anything is copied.
        id:
          type: string
          description: The sandbox id. Minted when empty; an id that is already a sandbox is 409.
        owner: { type: string }
        egress:
          type: array
          items: { type: string }
          description: >
            Egress allowlist as "host:port" destinations. Empty or absent means the
            sandbox reaches nothing, which is the default a sandbox should have.
        idleTtlSeconds:
          type: integer
          minimum: -1
          description: >
            Idle TTL for this sandbox in seconds: 0 means the node's default, -1
            means the reaper never takes it, and a positive value is the TTL.
        vcpus: { type: integer, minimum: 0 }
        memoryMB: { type: integer, minimum: 0 }

    SandboxFreed:
      type: object
      description: >
        What removing one sandbox took back, resource by resource, so "everything
        is gone" is a list rather than a promise.
      properties:
        processStopped: { type: boolean }
        socketRemoved: { type: boolean }
        cgroupRemoved: { type: boolean }
        jailRemoved: { type: boolean }
        netnsRemoved: { type: boolean }
        tapRemoved: { type: boolean }
        diskRemoved: { type: boolean }
        agentCredentialRemoved: { type: boolean }
        instanceRecordRemoved: { type: boolean }
        recordRemoved: { type: boolean }
        apiTokensRevoked: { type: integer, minimum: 0 }

    SandboxRemoval:
      type: object
      required: [schemaVersion, kind, sandbox, freed]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        kind: { type: string, enum: [SandboxRemoval] }
        sandbox: { type: string }
        freed: { $ref: "#/components/schemas/SandboxFreed" }

    SandboxTokenRequest:
      type: object
      properties:
        name:
          type: string
          description: The token's name. Empty is "sandbox <id>".
        expiresAt:
          type: string
          format: date-time
          description: An RFC3339 instant; absent means the token never expires.


    Checkpoint:
      type: object
      required: [name, sandbox]
      properties:
        name:
          type: string
          description: The checkpoint's identity, unique on the node.
        sandbox:
          type: string
          description: The sandbox it was taken from, which need not still exist.
        template: { type: string }
        kernel: { type: string }
        createdAt: { type: string, format: date-time }
        vcpus: { type: integer }
        memoryMB: { type: integer }
        egress:
          type: array
          items: { type: string }
          description: The allowlist a fork of this checkpoint installs.
        quiesceMode:
          type: string
          description: >
            The mechanism the guest used to stop its writers before the images were
            taken. Empty means it was checkpointed without one, so its consistency is
            unknown.
        quiesceMounts:
          type: array
          items: { type: string }
          description: >
            The filesystems the guest froze. Only writable filesystems backed by a block
            device are covered (a sandbox's root, and a workspace if it is one); tmpfs,
            /dev/shm and an overlay's upper layer are not.
        sizeBytes: { type: integer, format: int64 }
        agentVersion: { type: string }
        bootId: { type: string }

    CheckpointDocument:
      allOf:
        - $ref: "#/components/schemas/Checkpoint"
        - type: object
          required: [schemaVersion, kind]
          properties:
            schemaVersion: { type: integer, enum: [1] }
            kind: { type: string, enum: [Checkpoint] }

    CheckpointList:
      type: object
      required: [schemaVersion, kind, items, next]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        kind: { type: string, enum: [CheckpointList] }
        items:
          type: array
          items: { $ref: "#/components/schemas/Checkpoint" }
        next:
          type: [string, "null"]
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Warning" }

    CheckpointCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: >
            The checkpoint's identity, one safe path element, unique on the node. A
            checkpoint is named so it can be forked and freed later; an existing name is
            409.

    SandboxFork:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          description: How many clones to create. Absent means one.
        owner: { type: string, description: The clones' owner; empty inherits the checkpoint's. }
        idleTtlSeconds:
          type: integer
          description: >
            The clones' idle TTL in seconds: zero is the node's default, -1 means never
            reap them, and any other negative value is 400 "invalid_ttl".
        ids:
          type: array
          items: { type: string }
          description: >
            The clones' identities, in order. Empty mints them and the response carries
            them; a list of a different length than count is 400.

    CheckpointRemoval:
      type: object
      required: [schemaVersion, kind, checkpoint, freed]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        kind: { type: string, enum: [CheckpointRemoval] }
        checkpoint: { type: string }
        freed: { $ref: "#/components/schemas/CheckpointFreed" }

    CheckpointFreed:
      type: object
      required: [freedBytes, retainedBytes]
      properties:
        stateBytes: { type: integer, format: int64, description: The checkpoint's state document. }
        diskBytes: { type: integer, format: int64, description: The checkpoint's own disk copy. }
        chunkBytes: { type: integer, format: int64, description: The memory-image chunks nothing else referenced. }
        chunks: { type: integer, description: How many chunks those were. }
        freedBytes:
          type: integer
          format: int64
          description: What the node actually got back.
        retainedBytes:
          type: integer
          format: int64
          description: >
            The memory image the remaining checkpoints still reference. Shared chunks are
            counted once per referencing checkpoint, so this is what they reference rather
            than a deduplicated disk figure.
        retained: { type: integer, description: How many checkpoints remain. }

    SandboxToken:
      type: object
      required: [schemaVersion, kind, id, name, sandbox, scopes, token]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        kind: { type: string, enum: [SandboxToken] }
        id: { type: string }
        name: { type: string }
        sandbox: { type: string }
        scopes:
          type: array
          items: { type: string }
        token:
          type: string
          description: The bearer secret. It is present in this response and never again.
        expiresAt: { type: string, format: date-time }
