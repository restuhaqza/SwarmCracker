  /v1/sandboxes/{id}:
    get:
      operationId: getSandbox
      summary: Read one sandbox
      description: >
        Requires sandboxes:read. A sandbox this node does not have is 404
        not_found. What the document does not carry is host layout: the sandbox's
        jail, disk and agent-token path stay on the node.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The sandbox id.
      responses:
        "200":
          description: The sandbox
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
