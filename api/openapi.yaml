  /v1/checkpoints/{name}:
    get:
      operationId: getCheckpoint
      summary: Read one checkpoint
      description: Requires sandboxes:checkpoints. A name this node does not have is 404.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The checkpoint
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/CheckpointDocument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
    delete:
      operationId: deleteCheckpoint
      summary: Forget a checkpoint
      description: >
        Requires sandboxes:checkpoints. Removes the checkpoint's record, its state
        document and its disk copy, and reclaims the memory-image chunks no other
        checkpoint references: chunks are shared, so deleting one of two forks frees
        megabytes rather than the image. The response says both numbers — freedBytes and
        retainedBytes — so an operator is never left believing the disk came back when it
        is still referenced.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: What forgetting it freed, and what stayed referenced
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/CheckpointRemoval" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }

  /v1/checkpoints/{name}/fork:
    post:
      operationId: forkFromCheckpoint
      summary: Fork clones from a checkpoint by its name
      description: >
        Requires sandboxes:checkpoints. The sandbox the checkpoint came from need not
        exist: a checkpoint is an image, and this is the route that reaches one without
        it. The clones get their own namespace, address, MAC, disk and per-boot identity;
        the checkpoint itself is only read.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/vnd.swarmcracker.v1+json:
            schema: { $ref: "#/components/schemas/SandboxFork" }
      responses:
        "201":
          description: The clones, with the checkpoint they came from
          headers:
