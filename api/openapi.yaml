openapi: 3.1.0
info:
  title: SwarmCracker API
  version: "1"
  description: >
    Stable machine contract for SwarmCracker. This file is the normative
    description of the public API: every read route, the phase-2 write routes for
    services, configs, secrets, networks and nodes, the resource documents, the
    shared response headers, the error document and the bearer authentication
    model. The trusted Unix socket serves the same documents without a token; its
    file mode is the credential.
servers:
  - url: https://mgr:4244
    description: Manager public API (phase 1; TLS + bearer token)
security:
  # Every phase-1 TCP route needs a reader or admin bearer token, including
  # /v1/version. The trusted Unix socket (<state-dir>/api.sock) is the same
  # documents without a token; its file mode is the credential.
  - bearerAuth: []
paths:
  /v1/version:
    get:
      operationId: getVersion
      summary: Get the server version, supported API versions and capabilities
      responses:
        "200":
          description: The server's identity and feature-detection data
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/services:
    get:
      operationId: listServices
      summary: List services
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: label
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of services
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ServiceList" }
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
    post:
      operationId: createService
      summary: Create a service
      description: >
        Requires services:write. The body is a ServiceWrite: the writable
        subtree plus the write-only `spec.task.registryAuth`. The response never
        carries the credential. `If-None-Match: "*"` marks the request
        create-only; it does not turn POST into an upsert, and a name conflict is
        always a 409.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            enum: ["*"]
          description: >
            Create-only marker. Only `*` is accepted; any other value is invalid.
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/Wait"
        - $ref: "#/components/parameters/TimeoutMs"
      requestBody:
        required: true
        content:
          application/vnd.swarmcracker.v1+json:
            schema: { $ref: "#/components/schemas/ServiceWrite" }
      responses:
        "201":
          description: The created service
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
            Idempotency-Replayed: { $ref: "#/components/headers/Idempotency-Replayed" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ServiceDocument" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/services/{id}:
    get:
      operationId: getService
      summary: Get one service
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: A single service
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ServiceDocument" }
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
    patch:
      operationId: updateService
      summary: Merge-patch a service
      description: >
        Requires services:write. The body is an RFC 7386 merge patch over the
        writable service subtree. Only the fields present in the patch are
        written: SwarmKit fields this API does not model survive untouched.
        `null` resets an optional scalar, `null` on a map key deletes that key and
        `[]` clears an array. `id`, `name`, `revision`, the timestamps, `status`
        and `spec.mode` are immutable. If-Match is required.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: >
            Service reference: exact id, exact name, or a unique id prefix of at
            least 4 characters.
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
          description: >
            The revision from the last read. `"17"` must equal the current
            revision; `*` matches any revision but the service must exist; a weak
            `W/"17"` never matches. Missing is 428, stale or weak is 412.
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/Wait"
        - $ref: "#/components/parameters/TimeoutMs"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/ServicePatch" }
      responses:
        "200":
          description: The updated service
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ServiceDocument" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
    delete:
      operationId: deleteService
      summary: Delete a service
      description: >
        Requires services:write. Preconditions are evaluated before
        `ignoreMissing`: a missing service with If-Match is 412, without it 404,
        or 204 when `ignoreMissing=true`. Delete is not atomic with the
        precondition: SwarmKit's RemoveServiceRequest carries no version, so a
        concurrent update can land between the check and the removal.
        A `dryRun` parameter is 400 invalid: there is nothing to preview on a delete.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: >
            Service reference: exact id, exact name, or a unique id prefix of at
            least 4 characters.
        - name: ignoreMissing
          in: query
          required: false
          schema: { type: boolean }
          description: Treat a missing service as success (204).
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
          description: >
            Optional. When present it is evaluated before ignoreMissing; `*`
            matches any revision but the service must exist.
      responses:
        "204":
          description: Deleted. No body.
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/services/{id}/rollback:
    post:
      operationId: rollbackService
      summary: Roll a service back to its previous spec
      description: >
        Requires services:write. No request body: a non-empty body is invalid.
        If-Match is required, because a rollback is an update to the current
        spec.
        A `dryRun` parameter is 501 not_implemented with `details.capability: "dryRun"`: the previous spec is not the document that would be written.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: >
            Service reference: exact id, exact name, or a unique id prefix of at
            least 4 characters.
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/Wait"
        - $ref: "#/components/parameters/TimeoutMs"
      responses:
        "200":
          description: The rolled-back service
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
            Idempotency-Replayed: { $ref: "#/components/headers/Idempotency-Replayed" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ServiceDocument" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/services/{id}/tasks:
    get:
      operationId: listServiceTasks
      summary: List one service's tasks
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of tasks for one service
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/TaskList" }
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/networks:
    get:
      operationId: listNetworks
      summary: List user-defined networks
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: label
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of user-defined networks
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/NetworkList" }
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
    post:
      operationId: createNetwork
      summary: Create a network
      description: >
        Requires networks:write. The body is a NetworkWrite: name, driver
        (default "overlay"), an optional `ipam` pool whose subnet must be a
        network address in CIDR form and whose gateway must sit inside it (not the
        network or broadcast address), labels and `attachable`. `If-None-Match:
        "*"` marks the request create-only. There is no update: driver, IPAM and
        labels are fixed at create.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            enum: ["*"]
          description: Create-only marker. Only `*` is accepted.
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/vnd.swarmcracker.v1+json:
            schema: { $ref: "#/components/schemas/NetworkWrite" }
      responses:
        "201":
          description: The created network
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
            Idempotency-Replayed: { $ref: "#/components/headers/Idempotency-Replayed" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/NetworkDocument" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/networks/{id}:
    description: >
      Networks have no update in v1: driver, IPAM and labels are fixed at create.
      PATCH and PUT answer 405 invalid with details.reason "method_not_allowed"
      and Allow: GET, DELETE.
    get:
      operationId: getNetwork
      summary: Get one user-defined network
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: A single user-defined network
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/NetworkDocument" }
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
    delete:
      operationId: deleteNetwork
      summary: Delete a network
      description: >
        Requires networks:write. Preconditions are evaluated before
        `ignoreMissing`. There is no network update: PATCH and PUT on this path
        answer 405.
        A `dryRun` parameter is 400 invalid: there is nothing to preview on a delete.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: >
            Network reference: exact id, exact name, or a unique id prefix of at
            least 4 characters.
        - name: ignoreMissing
          in: query
          required: false
          schema: { type: boolean }
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "204":
          description: Deleted. No body.
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/configs:
    get:
      operationId: listConfigs
      summary: List configs
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: label
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of config metadata
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ConfigList" }
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
    post:
      operationId: createConfig
      summary: Create a config
      description: >
        Requires configs:write. The body is a ConfigWrite: name, labels and a
        UTF-8 `data` payload. A payload that is not valid UTF-8 is 400 invalid
        with details.reason "binary_not_supported". `If-None-Match: "*"` marks the
