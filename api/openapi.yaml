    get:
      operationId: listTasks
      summary: List tasks
      description: >
        Requires tasks:read. With `health=true` every task on the resolved page
        is enriched with the live healthcheck state its node publishes. Health
        travels through the node broker: the manager never dials a node's
        loopback endpoint. Enrichment is best-effort, so a page that loses a node
        is answered 207 with the readable tasks in `items` and one `partial`
        entry per failed node. A task that has published no health omits `health`
        entirely; an empty object is never emitted. Without `health=true` the
        response is exactly the unenriched list. `label` is accepted for SDK
        compatibility and ignored: this list is never filtered by it.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
          description: >
            Opaque cursor taken from a previous response's `next`. It is bound to
            the route and to the effective filter values that produced the page
            (the label selectors on routes that filter, the `task` reference on
            the flat snapshot routes); `limit` may change between pages. A
            cursor sent to a different query is 400 invalid with
            details.reason "cursor_mismatch", and a cursor this server did not
            issue is 400 invalid, with `details.cursor` carrying the rejected
            value.
        - name: health
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >
            Enrich every task on the page with its live health. Only `true` and
            `false` are accepted. Requires a node broker on the serving manager;
            without one the request is 501 not_implemented with
            details.capability "health".
        - name: label
          in: query
          schema: { type: string }
          description: >
            Accepted and currently ignored: the list is not filtered by label.
            The parameter is declared so that the v1 SDKs, which document
            forwarding a `label` selector on every list, keep working unchanged.
            It changes neither `items` nor the cursor binding, and unlike every
            other route that declares `label` (`/v1/services`, `/v1/nodes`,
            `/v1/networks`, `/v1/configs`, `/v1/secrets`, `/v1/events`) a value
            here is not even parsed — filter tasks client-side instead.
      responses:
        "200":
          description: A page of tasks
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/TaskList" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "207":
          description: >
            A partial page. This is a normal TaskList document, not an Error
            document: `items` contains every readable task of the page and
            `partial` names one entry per node whose health could not be read.
            A task on a failed node keeps `health` omitted. Pagination and item
            order are unchanged from a 200.
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/TaskList" }
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429": { $ref: "#/components/responses/RateLimited" }
        "501":
          $ref: "#/components/responses/NotImplemented"
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/tasks/{id}:
    get:
      operationId: getTask
      summary: Get one task
      description: >
        Requires tasks:read. With `health=true` the task is enriched with the
        live healthcheck state its node publishes. A task that has published no
        health omits `health`. If the node cannot be reached the read is 503
        unavailable: a single-task document has no `partial` array to carry the
        failure.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: health
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >
            Enrich the task with its live health. Only `true` and `false` are
            accepted. Requires a node broker on the serving manager; without one
            the request is 501 not_implemented with details.capability "health".
      responses:
        "200":
          description: A single task
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/TaskDocument" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429": { $ref: "#/components/responses/RateLimited" }
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/tasks/{id}/exec:
    post:
      operationId: execTask
      summary: Run a command in a task and stream its output
      description: >
        Requires tasks:exec. The task reference is resolved server-side and the
        request is relayed to the node that runs the task, so the caller never
        picks a host. Selectors are enforced: a runner token runs only the tasks
        its selectors match, and a runner token without selectors is 403. The
        body is an ExecRequest; the response is the documented exception to the
        v1 envelope and is an `application/x-ndjson` stream of ExecFrame
        objects. Interactive exec is not implemented over HTTP: a body with
        `tty:true` (and therefore any `stdin:true` request, which requires a
        TTY) is rejected before proxying with 501 not_implemented and
        details.reason "tty_not_supported". Local `vm exec -it` is unaffected.
        The task must be running: a completed or crashed task has no guest agent,
        so it is 404 not_found (its console log stays readable through the logs
        route). The attempt is audited as task.exec; a relayed node failure is
        audited as error, not ok.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: >
            Task reference: exact task id, or a unique id prefix of at least 4
            characters. A task name is accepted when it is unique.
      requestBody:
        required: true
        content:
          application/vnd.swarmcracker.v1+json:
            schema: { $ref: "#/components/schemas/ExecRequest" }
      responses:
        "200":
          description: >
            The exec output stream: one ExecFrame JSON object per line, flushed
            as output is produced, not a JSON array and not the v1 envelope. A
            successful stream ends with exactly one `exit` frame, which is
            required: a stream that ends without it is a failed exec and must
            not be treated as success. A non-zero guest exit is still a
            successful API call and arrives as `exit` with `exitCode` (plus
            `signal` and `exitCode` 128+N when the guest was killed by signal
            N). If the command starts and then fails, the terminal frame is
            `error` with `code` "internal" or "timeout" instead, and no exit
            code is fabricated.
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/ExecFrame" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429": { $ref: "#/components/responses/RateLimited" }
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/tasks/{id}/attach:
    post:
      operationId: attachTask
      summary: Attach to a task's interactive console over one full-duplex stream
      description: >
        Requires tasks:exec. The task reference is resolved server-side and the
        request is relayed to the node that runs the task, so the caller never
        picks a host. Selectors are enforced exactly as for exec: a runner token
        runs only the tasks its selectors match, and a runner token without
        selectors is 403.

        The transport is one HTTP/1.1 request, full duplex: the chunked request
        body is the caller's stdin and the chunked response body is the guest
        console. Both directions are live at the same time, so a prompt can
        arrive before the caller has finished typing. There is no WebSocket and
        no second connection. The response is raw
        `application/octet-stream` (the documented exception to the v1
        envelope) and is flushed as the guest writes. The caller half-closes the
        request body to send the guest an EOF; the session ends when the console
        closes, the caller disconnects, or the request is cancelled.

        The route takes no query parameter: the transport already carries a TTY,
        so `?tty=` and every other unknown name are 400 invalid with
        details.parameter. The route is streaming, so an `Idempotency-Key` is
        ignored rather than buffered. The task must be running and its console
        must exist: a stopped task, or one whose console socket is missing, is
        404 not_found with details.reason "console_unavailable". A console that
        exists but cannot be dialed is 503 unavailable with the same reason and
        retryable true. The attempt is audited as task.attach with the resolved
        task ID; a relayed node failure is audited as error, not ok.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: >
            Task reference: exact task id, or a unique id prefix of at least 4
            characters. A task name is accepted when it is unique.
      requestBody:
        required: false
        description: >
          The caller's stdin, streamed to the guest console as it is written. It
          is absent for a read-only attach, and the caller closes it to signal
          EOF to the guest.
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: >
            The guest console output, streamed while the request body is still
            open. Bytes are flushed as they arrive and are not framed: there is
            no NDJSON envelope and no terminal frame, because a console has
            neither. The stream ends when the console closes; the caller should
            treat a closed response as the end of the session rather than as a
            failure.
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >
            The task does not exist, is not running, or has no console socket.
            For a task this node manages but cannot attach to, code is not_found
            and details.reason is "console_unavailable".
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/tasks/{id}/logs:
    get:
      operationId: getTaskLogs
      summary: Stream a task's console log
      description: >
        Requires tasks:logs, which every role carries. The task reference is
        resolved server-side and the request is relayed to the node that runs the
        task, so the caller never picks a host. Logs are reader-scoped: task
        selectors do not gate them and the read is not audited. The response is
        the documented exception to the v1 envelope and is an
        `application/x-ndjson` stream of LogFrame objects, one per line, flushed
        as output is produced and never buffered. The Firecracker console merges
        stdout and stderr, so `stream` is always stdout. `tail` selects the
        backlog (default 200, maximum 10000; a larger value is clamped); `since`
        is an RFC3339 instant applied before `tail`. The console file carries no
        per-line timestamps, so backlog lines are stamped with the file's
        modification time and followed lines with the time they were read. A
        `follow` stream never ends with `eof`: it ends when the caller
        disconnects, when the task's VM stops, or when its log disappears. Logs
        remain available after the task exits — the console file outlives the VM
        — so this is the route to use to find out why a task failed. A missing
        task or a task with no log is 404; a node that cannot be reached is 503
        unavailable. A manager with no node broker answers 501 not_implemented
        with details.capability "logs".
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: >
            Task reference: exact task id, a unique id prefix of at least 4
            characters, or a unique task name.
        - name: tail
          in: query
          schema: { type: integer, minimum: 0, default: 200 }
          description: >
            Number of backlog lines, oldest to newest. Negative or non-numeric is
            400 invalid; above 10000 is clamped.
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: >
            Only backlog lines at or after this instant. Invalid RFC3339 is 400
            invalid.
        - name: follow
          in: query
          schema: { type: boolean, default: false }
          description: >
            Keep streaming appended output. A value that is not a boolean is 400
            invalid.
      responses:
        "200":
          description: >
            The log stream: one LogFrame JSON object per line, flushed as output
            is produced, not a JSON array and not the v1 envelope. A non-following
            stream always ends with one `eof` frame, which a caller must see to
            treat the backlog as complete. A following stream has no terminal
            frame.
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/LogFrame" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429": { $ref: "#/components/responses/RateLimited" }
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/tasks/{id}/files:
    get:
      operationId: getTaskFile
      summary: Read a regular file from a task
      description: >
        Requires tasks:files. The task reference is resolved server-side, the
        caller's task selectors are enforced (a runner needs a matching selector;
        a mismatch is 403) and the attempt is audited as `task.files` with result
        ok or error. The audit resource is the task: the path and the contents are
        never recorded. The response is raw bytes — the documented exception to
        the v1 envelope — with Content-Type application/octet-stream. Only regular
        files are served: the path must be absolute and must not contain a `..`
        segment (400 invalid otherwise). A directory is 400 invalid with
        details.reason "directory_not_supported"; a missing file is 404. The
        task must be running: a completed or crashed task has no guest agent, so
        it is 404 not_found (its console log stays readable through the logs
        route). A manager with no node broker answers 501 not_implemented with
        details.capability "files".
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: >
            Task reference: exact task id, a unique id prefix of at least 4
            characters, or a unique task name.
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: >
            Absolute guest path. Cleaned before use; a `..` segment is refused
            rather than collapsed.
      responses:
        "200":
          description: The file bytes, streamed as they arrive.
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429": { $ref: "#/components/responses/RateLimited" }
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
    put:
      operationId: putTaskFile
      summary: Write a regular file in a task
      description: >
        Requires tasks:files. The task reference is resolved server-side, the
        caller's task selectors are enforced and the attempt is audited as
        `task.files`. The body is the raw file: Content-Type must be
        application/octet-stream (415 otherwise) and the response is 204 on
        success. The body is limited to 1 GiB (413, details.reason
        "payload_too_large"); the manager forwards the upload without buffering
        it. `mode` is an octal file mode between 0000 and 0777 (default 0644;
        anything else is 400 invalid). The path rules of GET apply. The task must
        be running: a completed task has no guest agent and is 404 not_found. Audit
        records the task, never the path or the contents. A manager with no node
        broker answers 501 not_implemented with details.capability "files".
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: >
            Task reference: exact task id, a unique id prefix of at least 4
            characters, or a unique task name.
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: >
            Absolute guest path. Cleaned before use; a `..` segment is refused
            rather than collapsed.
        - name: mode
          in: query
          schema: { type: string, default: "0644", pattern: "^[0-7]{3,4}$" }
          description: >
            Octal file mode between 0000 and 0777. Anything else is 400 invalid.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204":
          description: The file was written.
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429": { $ref: "#/components/responses/RateLimited" }
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/tasks/{id}/snapshots:
    post:
      operationId: createTaskSnapshot
      summary: Snapshot a running task's VM (experimental)
      description: >
        Requires tasks:snapshots. Experimental and disabled by default: a manager
        that has not enabled snapshots answers 501 not_implemented with
        details.capability "snapshots" before the task is resolved and before
        anything is audited. The task reference is resolved server-side and the
        caller's task selectors are enforced exactly as exec does. The body is
        optional: an empty body snapshots the VM with the resources it is running
        with; a body must be a SnapshotCreateRequest with Content-Type
        application/vnd.swarmcracker.v1+json and is limited to 64 KiB (413,
        details.reason "payload_too_large"). Unknown fields are 400 invalid. The
        task must be running: a completed or crashed task has no Firecracker API
        socket and is 404 not_found with details.reason "task_not_running". If
        SwarmKit still reports the task as running but the VM's API socket has
        disappeared by the time the node snapshots it, the answer is 409 conflict
        with details.reason "vm_socket_missing".
        pkg/snapshot's metadata.json is the source of truth; there is no
        manager-side index. The attempt is audited as task.snapshot. A snapshot's
        memory and state paths never cross the wire, and neither does the path of
        the snapshot-owned disk copy: only rootfsPath is published. Both live in
        the node's metadata.json (the copy as disk_path) and are node-local.
        A create copies the task disk, so the manager's deadline defaults to five
        minutes (--snapshot-timeout); a create or restore that exceeds it is 504
        with code timeout. sizeBytes on the response counts the memory image, the
        state file and the disk copy.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: >
            Task reference: exact task id, a unique id prefix of at least 4
            characters, or a unique task name.
      requestBody:
        required: false
        content:
          application/vnd.swarmcracker.v1+json:
            schema: { $ref: "#/components/schemas/SnapshotCreateRequest" }
      responses:
        "201":
          description: The snapshot was created.
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/SnapshotDocument" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429": { $ref: "#/components/responses/RateLimited" }
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          description: >
            The snapshot operation exceeded its deadline: code timeout,
            retryable true.
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
        "4XX":
