              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/secrets:
    get:
      operationId: listSecrets
      summary: List secrets
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: label
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of secret metadata
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/SecretList" }
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "4XX":
