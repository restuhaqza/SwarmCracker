openapi: 3.1.0
info:
  title: SwarmCracker API
  version: "1"
  description: >
    Stable machine contract for SwarmCracker. This file is the normative
    description of the public API: every read route, the phase-2 write routes for
    services, configs, secrets, networks and nodes, the task exec and attach
    streams, the resource documents, the shared response headers, the error
    document and the bearer authentication model. The trusted Unix socket serves
    the same documents without a token; its file mode is the credential. The
    snapshot routes are experimental and disabled by default: a manager must opt
    in, and until it does every snapshot route answers 501 not_implemented.
    Every operation declares the query parameters it implements; a name outside
    that set is 400 invalid with details.parameter rather than being ignored, and
    a list cursor is bound to the route and filter that produced it (400
    details.reason "cursor_mismatch" otherwise).
servers:
  - url: https://mgr:4244
    description: Manager public API (phase 1; TLS + bearer token)
security:
  # Every phase-1 TCP route needs a reader or admin bearer token, including
  # /v1/version. The trusted Unix socket (<state-dir>/api.sock) is the same
  # documents without a token; its file mode is the credential.
  - bearerAuth: []
paths:
  /v1/version:
    get:
      operationId: getVersion
      summary: Get the server version, supported API versions and capabilities
      responses:
        "200":
          description: The server's identity and feature-detection data
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/services:
    get:
      operationId: listServices
      summary: List services
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
          description: >
            Opaque cursor taken from a previous response's `next`. It is bound to
            the route and to the effective filter values that produced the page
            (the label selectors on routes that filter, the `task` reference on
            the flat snapshot routes); `limit` may change between pages. A
            cursor sent to a different query is 400 invalid with
            details.reason "cursor_mismatch", and a cursor this server did not
            issue is 400 invalid, with `details.cursor` carrying the rejected
            value.
        - name: label
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of services
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ServiceList" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
    post:
      operationId: createService
      summary: Create a service
      description: >
        Requires services:write. The body is a ServiceWrite: the writable
        subtree plus the write-only `spec.task.registryAuth`. The response never
        carries the credential. `If-None-Match: "*"` marks the request
        create-only; it does not turn POST into an upsert, and a name conflict is
        always a 409.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            enum: ["*"]
          description: >
            Create-only marker. Only `*` is accepted; any other value is invalid.
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/Wait"
        - $ref: "#/components/parameters/TimeoutMs"
      requestBody:
        required: true
        content:
          application/vnd.swarmcracker.v1+json:
            schema: { $ref: "#/components/schemas/ServiceWrite" }
      responses:
        "201":
          description: The created service
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
            Idempotency-Replayed: { $ref: "#/components/headers/Idempotency-Replayed" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ServiceDocument" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/services/{id}:
    get:
      operationId: getService
      summary: Get one service
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: A single service
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ServiceDocument" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
    patch:
      operationId: updateService
      summary: Merge-patch a service
      description: >
        Requires services:write. The body is an RFC 7386 merge patch over the
        writable service subtree. Only the fields present in the patch are
        written: SwarmKit fields this API does not model survive untouched.
        `null` resets an optional scalar, `null` on a map key deletes that key and
        `[]` clears an array. `id`, `name`, `revision`, the timestamps, `status`
        and `spec.mode` are immutable. If-Match is required.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: >
            Service reference: exact id, exact name, or a unique id prefix of at
            least 4 characters.
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
          description: >
            The revision from the last read. `"17"` must equal the current
            revision; `*` matches any revision but the service must exist; a weak
            `W/"17"` never matches. Missing is 428, stale or weak is 412.
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/Wait"
        - $ref: "#/components/parameters/TimeoutMs"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/ServicePatch" }
      responses:
        "200":
          description: The updated service
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ServiceDocument" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
    delete:
      operationId: deleteService
      summary: Delete a service
      description: >
        Requires services:write. Preconditions are evaluated before
        `ignoreMissing`: a missing service with If-Match is 412, without it 404,
        or 204 when `ignoreMissing=true`. Delete is not atomic with the
        precondition: SwarmKit's RemoveServiceRequest carries no version, so a
        concurrent update can land between the check and the removal.
        A `dryRun` parameter is 400 invalid: there is nothing to preview on a delete.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: >
            Service reference: exact id, exact name, or a unique id prefix of at
            least 4 characters.
        - name: ignoreMissing
          in: query
          required: false
          schema: { type: boolean }
          description: Treat a missing service as success (204).
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
          description: >
            Optional. When present it is evaluated before ignoreMissing; `*`
            matches any revision but the service must exist.
      responses:
        "204":
          description: Deleted. No body.
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/services/{id}/rollback:
    post:
      operationId: rollbackService
      summary: Roll a service back to its previous spec
      description: >
        Requires services:write. No request body: a non-empty body is invalid.
        If-Match is required, because a rollback is an update to the current
        spec.
        A `dryRun` parameter is 501 not_implemented with `details.capability: "dryRun"`: the previous spec is not the document that would be written.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: >
            Service reference: exact id, exact name, or a unique id prefix of at
            least 4 characters.
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/Wait"
        - $ref: "#/components/parameters/TimeoutMs"
      responses:
        "200":
          description: The rolled-back service
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
            Idempotency-Replayed: { $ref: "#/components/headers/Idempotency-Replayed" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ServiceDocument" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/migrations:
    post:
      operationId: createMigration
      summary: Move one service task's VM to another node
      description: >
        Requires migrations:write, which only the admin role holds: a migration
        replaces a service's task and relays a guest's memory image between hosts.
        The call is synchronous and bounded by three minutes, plus up to one minute of
        cleanup outside that deadline (the manager performs it before answering, so a
        client timeout shorter than four minutes can drop a response for a move the
        manager still completes). Only the swarm's raft leader runs
        a migration: a request served by any other manager answers 503 unavailable with
        details.reason "not_leader" and details.leader naming the node to retry against,
        because two managers running the same move would prepare the target's directive
        twice and unpin each other's placement. A manager that cannot tell from the node
        list which node is the leader runs the migration anyway - refusing every move
        on a cluster that cannot report its leader would be worse than a race the
        service update itself detects.
        The manager validates the task, exports it on the node it runs on, relays the
        artifact's files one at a time through its own spool, records the target's
        pending-restore directive, pins the service to the target, waits for a
        replacement to report running, then restores the service's placement and
        discards the artifact.
        The body is a MigrationRequest: both fields are required and unknown fields
        are rejected. A task that is not running, a service that is not replicated
        with exactly one replica, a target that is the task's own node, and a target
        that is not ready and active are all 400 invalid, resolved before anything is
        exported. A second migration of the same service while one is in flight is
        409 conflict with details.reason "migration_in_flight".
        A manager with no migration transport answers 501 not_implemented with
        details.capability "migrations". The answer to a migration the manager ran
        is 201 whatever its outcome: outcome "moved" carries the measured
        downtimeMs, and outcome "pending" means the service was replaced but no
        replacement reported running before the verify deadline - the target keeps
        the directive and the bytes it staged. A retry of that replacement restores
        from that copy when it runs on the target; the manager restores the service's
        placement, so a retry scheduled elsewhere boots a fresh VM. The source node's
        export is deleted as soon as the service update has landed, whatever the
        outcome. A failure that left nothing behind is a typed error document with
        the phase that failed in details.phase. There is no status route: the call
        is the report. The attempt is audited as task.migrate.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/vnd.swarmcracker.v1+json:
            schema: { $ref: "#/components/schemas/MigrationRequest" }
      responses:
        "201":
          description: >
            The migration report: the artifact that carried the VM, the phases it
            ran, the measured downtime and how the move ended.
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
            Idempotency-Replayed: { $ref: "#/components/headers/Idempotency-Replayed" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/Migration" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429": { $ref: "#/components/responses/RateLimited" }
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          description: >
            A node call or the whole migration exceeded its deadline: code
            timeout, retryable true, with details.phase naming the step.
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/services/{id}/tasks:
    get:
      operationId: listServiceTasks
      summary: List one service's tasks
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
          description: >
            Opaque cursor taken from a previous response's `next`. It is bound to
            the route and to the effective filter values that produced the page
            (the label selectors on routes that filter, the `task` reference on
            the flat snapshot routes); `limit` may change between pages. A
            cursor sent to a different query is 400 invalid with
            details.reason "cursor_mismatch", and a cursor this server did not
            issue is 400 invalid, with `details.cursor` carrying the rejected
            value.
      responses:
        "200":
          description: A page of tasks for one service
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/TaskList" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/networks:
    get:
      operationId: listNetworks
      summary: List user-defined networks
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
          description: >
            Opaque cursor taken from a previous response's `next`. It is bound to
            the route and to the effective filter values that produced the page
            (the label selectors on routes that filter, the `task` reference on
            the flat snapshot routes); `limit` may change between pages. A
            cursor sent to a different query is 400 invalid with
            details.reason "cursor_mismatch", and a cursor this server did not
            issue is 400 invalid, with `details.cursor` carrying the rejected
            value.
        - name: label
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of user-defined networks
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/NetworkList" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429": { $ref: "#/components/responses/RateLimited" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
    post:
      operationId: createNetwork
      summary: Create a network
      description: >
        Requires networks:write. The body is a NetworkWrite: name, driver
        (default "overlay"), an optional `ipam` pool whose subnet must be a
        network address in CIDR form and whose gateway must sit inside it (not the
        network or broadcast address), labels and `attachable`. `If-None-Match:
        "*"` marks the request create-only. There is no update: driver, IPAM and
        labels are fixed at create.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            enum: ["*"]
          description: Create-only marker. Only `*` is accepted.
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/vnd.swarmcracker.v1+json:
            schema: { $ref: "#/components/schemas/NetworkWrite" }
      responses:
        "201":
          description: The created network
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
