        content:
          application/vnd.swarmcracker.v1+json:
            schema: { $ref: "#/components/schemas/SandboxFork" }
      responses:
        "201":
          description: The clones, with the checkpoint they came from
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            Idempotency-Replayed: { $ref: "#/components/headers/Idempotency-Replayed" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/SandboxList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }

  /v1/checkpoints:
    get:
      operationId: listCheckpoints
      summary: List every checkpoint on this node
      description: >
        Requires sandboxes:checkpoints. This is the node-scoped view a checkpoint needs:
        it outlives the sandbox it was taken from, so a checkpoint whose sandbox is gone
        would otherwise be listed nowhere. A record that cannot be read is a warnings[]
        entry and does not fail the listing.
      responses:
