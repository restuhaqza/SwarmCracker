      operationId: createSandbox
      summary: Create a sandbox from a sealed template
      description: >
        Requires sandboxes:write. The body is a SandboxCreate. The template is
        resolved through the node's sealed-template store, where its pin is
        checked against the software this node actually runs: a template built on
        another Firecracker version or another kernel is 409 conflict with code
        "template_pin_mismatch", before a disk is copied and before any VMM
        exists. A template whose guest agent cannot run the operations this host
        needs is 409 "template_incompatible". The response is the sandbox in state
        "ready", which means its guest agent answered its hello — not that a VMM
        started; the call returns only once that happened, so it can take as long
        as a boot. An id that is already a sandbox is 409 conflict; the node does
        not replace one. Before anything is allocated for it the sandbox is
        admitted against the node's quota — how many sandboxes one owner may
        hold, and how much memory and disk all of the node's sandboxes may occupy
        together — so a refusal is 429 quota_exceeded carrying details.limit and
        details.used, and it leaves no record, no network namespace, no disk and
        no VM behind: there is nothing for the caller to clean up. The attempt is
        audited as sandbox.create.
