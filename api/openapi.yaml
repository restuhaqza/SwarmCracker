              schema: { $ref: "#/components/schemas/SandboxDocument" }
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429": { $ref: "#/components/responses/RateLimited" }
        "501":
          $ref: "#/components/responses/NotImplemented"
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
    delete:
      operationId: removeSandbox
      summary: Remove a sandbox and everything it holds
      description: >
        Requires sandboxes:write, and the caller's sandbox selectors must name
        this sandbox (403 details.reason "sandbox_selector_mismatch" otherwise;
        a runner token with no sandbox selector is 403
        "sandbox_selector_required"). The teardown stops the VMM first: if it
        cannot be stopped, nothing else is freed and the refusal says so, because
        freeing a live VM's namespace and disk is not a removal. Then the socket,
        cgroup, jail, network namespace (with the TAP device and the policy in
        it), disk, the host's copy of the agent token, the node's instance record
        and every API token scoped to the sandbox are freed, and the record is
        deleted last. The response reports each of those, so "everything is gone"
        is a list rather than a promise. The VMM's console log is kept, as a
        task's log outlives its task.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The sandbox id.
      responses:
        "200":
          description: The sandbox and what removing it freed
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/SandboxRemoval" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429": { $ref: "#/components/responses/RateLimited" }
        "501":
          $ref: "#/components/responses/NotImplemented"
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/sandboxes/{id}/exec:
    post:
      operationId: execSandbox
      summary: Run a command in a sandbox and stream its output
      description: >
        Requires sandboxes:exec, and the caller's sandbox selectors must name this
        sandbox: a token minted for one sandbox gets 403 with details.reason
        "sandbox_selector_mismatch" for another, and names the sandbox it was
        asked about in details.sandboxId. A runner token with no sandbox selector
        is 403 "sandbox_selector_required". The body is the task route's
        ExecRequest and the response is the same `application/x-ndjson` stream of
        ExecFrame objects, produced by the same handler: a caller that can follow
        a task's exec stream does not learn a second one. The command runs over the
        sandbox's guest agent, which is the only way into its guest. A sandbox
        that is not ready (state created, failed or stopped) is 409 conflict and
        its reason is in the message; interactive exec is 501
        details.reason "tty_not_supported", as on the task route. The attempt is
        audited as sandbox.exec.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The sandbox id.
      requestBody:
        required: true
        content:
          application/vnd.swarmcracker.v1+json:
            schema: { $ref: "#/components/schemas/ExecRequest" }
      responses:
        "200":
          description: >
            The exec output stream: one ExecFrame JSON object per line, ending
            with exactly one `exit` frame. A non-zero guest exit is a successful
            call and arrives as `exit` with `exitCode` (plus `signal` and
            `exitCode` 128+N when the guest was killed by signal N).
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/ExecFrame" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429": { $ref: "#/components/responses/RateLimited" }
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/sandboxes/{id}/tokens:
    post:
      operationId: createSandboxToken
      summary: Mint an API token scoped to one sandbox
      description: >
        Requires sandboxes:token, which only an admin token (or the trusted Unix
        socket) holds: issuing a credential is administrative work. The token the
        response carries holds exactly sandboxes:read and sandboxes:exec, narrowed
        by a sandbox selector that names this sandbox, so it can run commands in
        this sandbox and read it, and cannot exec in another sandbox (403
        "sandbox_selector_mismatch"), create or remove one (403
        "scope_missing" with details.requiredScope "sandboxes:write") or mint
        another (403 "scope_missing" with "sandboxes:token"). The secret is in
        this response and never again; removing the sandbox deletes the token.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The sandbox the token is scoped to. It must exist on this node.
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/vnd.swarmcracker.v1+json:
            schema: { $ref: "#/components/schemas/SandboxTokenRequest" }
      responses:
        "201":
          description: The minted token, with its secret
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            Idempotency-Replayed: { $ref: "#/components/headers/Idempotency-Replayed" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/SandboxToken" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429": { $ref: "#/components/responses/RateLimited" }
        "501":
          $ref: "#/components/responses/NotImplemented"
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
  /v1/sandboxes/{id}/checkpoints:
    post:
      operationId: createSandboxCheckpoint
      summary: Take a consistent checkpoint of one sandbox
      description: >
        Requires sandboxes:checkpoints and a sandbox selector that names this sandbox.
        The node freezes the guest's writers first (the agent's quiesce op: sync, then
        the freeze ioctl on every writable filesystem backed by a block device), takes
        the memory image, the state document and a copy of the disk while nothing can
        write, releases the guest, and publishes the checkpoint under the body's name.
        201 only once the images are stored. A guest that cannot be frozen fails the
        checkpoint: an image whose consistency is unknown is not stored. Names are unique
        on the node, so an existing one is 409. The guest's credential travels with the
        checkpoint (a resumed guest still requires it) and never crosses this API.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The sandbox to checkpoint. It must be ready.
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/vnd.swarmcracker.v1+json:
            schema: { $ref: "#/components/schemas/CheckpointCreate" }
      responses:
        "201":
          description: The checkpoint, published
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            Idempotency-Replayed: { $ref: "#/components/headers/Idempotency-Replayed" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/CheckpointDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }
    get:
      operationId: listSandboxCheckpoints
      summary: List one sandbox's checkpoints
      description: >
        Requires sandboxes:checkpoints. A checkpoint record that cannot be read is a
        warnings[] entry (code "checkpoint_record_unreadable") and does not fail the
        listing.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: This sandbox's checkpoints
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/CheckpointList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "4XX":
          description: Typed failure
          headers:
            X-SwarmCracker-Api-Version: { $ref: "#/components/headers/X-SwarmCracker-Api-Version" }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/vnd.swarmcracker.v1+json:
              schema: { $ref: "#/components/schemas/ErrorDocument" }

  /v1/sandboxes/{id}/checkpoints/{name}/restore:
    post:
      operationId: restoreCheckpoint
      summary: Fork one clone from a checkpoint of this sandbox
      description: >
        Requires sandboxes:checkpoints and a sandbox selector that names the sandbox in
        the path. A checkpoint whose record names another sandbox is 404: the resource
        the caller asked about is not this sandbox's, and a 403 would confirm the name
        exists. The sandbox itself need not still exist — a checkpoint is an image — but
        the path still names its parent. Returns one clone, as a SandboxDocument.
