        task answers 409 conflict with details.reason "snapshot_incomplete". The
        restore starts a new VM at the task's own API socket on the node's socket
        directory, so the restored VM keeps the task's identity: exec, files,
        attach and logs resolve it by the same task ID. Restores are
        serialized per task; a concurrent restore for
