name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - 'sdk/**'
      - 'docs-site/examples/**'
      - 'test/examples/**'
      - 'test/conformance/**'
      - 'tools/sdkgen/**'
      - 'api/openapi.yaml'
      - 'Dockerfile.cli'
      - '.dockerignore'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the base branch is available for the coverage gate.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Check Go version alignment
        run: make check-go-version

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./pkg/... ./cmd/...

      - name: Test (all packages, with race detector)
        run: go test -short -race -coverprofile=coverage.out -covermode=atomic ./pkg/...

      # An absolute percentage is not a stable gate: the runner has no
      # Firecracker/jailer (some tests skip) and `main` gains code between
      # branches, so the same tree measures differently over time. The
      # meaningful invariant is that a PR does not *lower* coverage relative
      # to the branch it targets, measured in the same runner. The 85% figure
      # remains the project target (see docs-site/src/content/docs/contributing/testing/unit-tests.md).
      - name: Coverage gate (no regression vs base)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          HEAD_PCT=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "head coverage: ${HEAD_PCT}%"

          if ! git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"; then
            echo "::warning::could not fetch base ${GITHUB_BASE_REF}; skipping regression check"
            exit 0
          fi
          if ! git worktree add --detach "${RUNNER_TEMP}/base" "origin/${GITHUB_BASE_REF}"; then
            echo "::warning::could not check out base ${GITHUB_BASE_REF}; skipping regression check"
            exit 0
          fi
          # Base tests may fail for reasons unrelated to coverage; we only need
          # its profile, so ignore the exit status.
          ( cd "${RUNNER_TEMP}/base" && go test -short -race -coverprofile="${RUNNER_TEMP}/base.out" -covermode=atomic ./pkg/... ) || true

          if [ ! -s "${RUNNER_TEMP}/base.out" ]; then
            echo "::warning::base coverage profile unavailable; skipping regression check"
            exit 0
          fi
          # Resolve the base profile from the base worktree: paths that exist on
          # the base branch may have moved or been removed on the PR branch.
          BASE_PCT=$( cd "${RUNNER_TEMP}/base" && go tool cover -func="${RUNNER_TEMP}/base.out" | tail -1 | awk '{print $3}' | tr -d '%' )
          if ! echo "$BASE_PCT" | grep -Eq '^[0-9]+(\.[0-9]+)?$'; then
            echo "::warning::could not parse base coverage (got '${BASE_PCT}'); skipping regression check"
            exit 0
          fi
          echo "base (${GITHUB_BASE_REF}) coverage: ${BASE_PCT}%"

          awk -v b="$BASE_PCT" -v h="$HEAD_PCT" 'BEGIN { exit (h+0 < b-0.1) }' || {
            echo "::error::coverage regressed: ${GITHUB_BASE_REF} ${BASE_PCT}% -> PR ${HEAD_PCT}%"
            exit 1
          }
          echo "coverage OK: no regression vs ${GITHUB_BASE_REF}"

      - name: Test CLI packages
        run: go test -short -race ./cmd/...

      - name: API contract acceptance
        run: make api-check

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # The generated models, the Python client and the Node client are checked
  # together: a spec change must regenerate both SDKs, and both suites must pass.
  sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generator drift check
        run: make sdk-check

      - name: Node SDK dependencies
        run: npm ci
        working-directory: sdk/node

      - name: Node SDK declaration typecheck
        run: make sdk-typecheck

      - name: Node SDK runtime stays dependency-free
        run: node -e "process.exit(Object.keys(require('./sdk/node/package.json').dependencies ?? {}).length ? 1 : 0)"

      - name: SDK test suites
        run: make sdk-test

      - name: Go SDK compile check
        run: go test ./sdk/go ./tools/sdkgen

  # One declarative fixture set, executed against the real apihttp handler with
  # an in-memory backend on loopback TLS. The identical fixtures run against a
  # live manager in the scheduled conformance-lab workflow.
  #
  # The whole package runs, not only TestConformanceMock: the loader/runner unit
  # tests and TestLabSkipPolicy guard the suite itself (a fixture that silently
  # stops running, a skip rule that stops skipping), so they belong on every PR.
  conformance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: API conformance suite
        run: go test ./test/conformance -count=1

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build all binaries
        run: make all

  lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  benchmark:
    runs-on: ubuntu-latest
    # Hard cap: Go's -timeout is not enforced while benchmarks run, so a
    # blocked benchmark would otherwise sit until GitHub's 6h job limit.
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Run benchmarks
        # -run='^$' runs benchmarks only; without it the non-short unit tests
        # (e.g. pkg/cni) run too and fail. -timeout bounds each package's build/run.
        run: go test -run='^$' -bench=. -benchmem -timeout=5m ./pkg/... | tee benchmark.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.txt

  # The documentation's executable contract: both SDK examples run against the
  # loopback fixture (no cluster, no token, no secret) and both images are built
  # and executed, so a stale snippet, a root/shell regression in Dockerfile.cli
  # or an unexecutable daemon binary in Dockerfile fails the PR.
  examples:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fixture tests
        run: go test ./test/examples/mockserver -count=1

      - name: SDK examples
        run: make examples

      - name: Build the CLI image
        run: docker build -f Dockerfile.cli -t swarmcracker-cli:ci .

      - name: Run the CLI image
        run: docker run --rm swarmcracker-cli:ci version

      # The daemon image regressed twice without anyone noticing: a same-named
      # file in the context shadowed make's file target so nothing was built,
      # and a PIE binary cannot exec under distroless/static. Both failures only
      # show up at `docker run`, so the image is built and executed here. The
      # empty ./swarmd-firecracker reproduces the shadowing condition.
      - name: Build the daemon image
        run: |
          : > swarmd-firecracker
          docker build -f Dockerfile -t swarmcracker-daemon:ci .

      - name: Run the daemon image
        run: docker run --rm swarmcracker-daemon:ci --version
