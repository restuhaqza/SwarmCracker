<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">SwarmCracker executor pipeline</title>
  <desc id="archDesc">SwarmKit manager sends tasks to the agent, which delegates to the SwarmCracker executor. The executor translates tasks, prepares images, sets up networking, and launches Firecracker microVMs via KVM.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b1d20"/>
    </marker>
    <pattern id="corrugate" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#868c93"/>
      <rect x="0" width="2.5" height="14" fill="#6f757b"/>
    </pattern>
    <style>
      .t   { font-family: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif; }
      .hd  { font-family: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; letter-spacing: 0.06em; }
      .mono{ font-family: 'SFMono-Regular', Menlo, Consolas, monospace; letter-spacing: 0.04em; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#fbfaf7"/>
  <rect x="14" y="14" width="1172" height="772" fill="none" stroke="#1b1d20" stroke-width="3"/>

  <!-- header bar -->
  <rect x="14" y="14" width="1172" height="62" fill="#1b1d20"/>
  <text x="40" y="54" class="hd" font-size="26" fill="#f5c518">SWARMCRACKER — EXECUTOR PIPELINE</text>
  <text x="1148" y="52" class="mono" font-size="15" fill="#fbfaf7" text-anchor="end">v0.10.0</text>

  <!-- band labels -->
  <text x="40" y="120" class="mono" font-size="15" fill="#a33d08">ORCHESTRATION</text>
  <text x="40" y="312" class="mono" font-size="15" fill="#a33d08">EXECUTOR</text>
  <text x="40" y="524" class="mono" font-size="15" fill="#a33d08">ISOLATION</text>

  <line x1="40" y1="132" x2="1160" y2="132" stroke="#c3c0b8" stroke-width="1"/>
  <line x1="40" y1="324" x2="1160" y2="324" stroke="#c3c0b8" stroke-width="1"/>
  <line x1="40" y1="536" x2="1160" y2="536" stroke="#c3c0b8" stroke-width="1"/>

  <!-- band 1: manager -> agent -> executor -->
  <g class="t" font-size="21" fill="#1b1d20">
    <rect x="70" y="168" width="290" height="96" fill="#e8e6e0" stroke="#1b1d20" stroke-width="2.5"/>
    <text x="215" y="205" class="hd" text-anchor="middle" font-size="22">SWARMKIT MANAGER</text>
    <text x="215" y="234" class="mono" text-anchor="middle" font-size="14" fill="#565c63">schedules services</text>

    <rect x="455" y="168" width="290" height="96" fill="#e8e6e0" stroke="#1b1d20" stroke-width="2.5"/>
    <text x="600" y="205" class="hd" text-anchor="middle" font-size="22">SWARMKIT AGENT</text>
    <text x="600" y="234" class="mono" text-anchor="middle" font-size="14" fill="#565c63">receives tasks</text>

    <rect x="840" y="168" width="290" height="96" fill="#e4570f" stroke="#1b1d20" stroke-width="2.5"/>
    <text x="985" y="205" class="hd" text-anchor="middle" font-size="22">SWARMCRACKER EXECUTOR</text>
    <text x="985" y="234" class="mono" text-anchor="middle" font-size="14" fill="#1b1d20">orchestrates VM lifecycle</text>
  </g>

  <line x1="360" y1="216" x2="450" y2="216" stroke="#1b1d20" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="745" y1="216" x2="835" y2="216" stroke="#1b1d20" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- band 2: executor internals -->
  <g class="t" font-size="19" fill="#1b1d20">
    <rect x="70" y="360" width="255" height="120" fill="#fbfaf7" stroke="#1b1d20" stroke-width="2.5"/>
    <text x="197" y="402" class="hd" text-anchor="middle" font-size="20">TASK</text>
    <text x="197" y="426" class="hd" text-anchor="middle" font-size="20">TRANSLATOR</text>
    <text x="197" y="456" class="mono" text-anchor="middle" font-size="13" fill="#565c63">task → VM config</text>

    <rect x="345" y="360" width="255" height="120" fill="#fbfaf7" stroke="#1b1d20" stroke-width="2.5"/>
    <text x="472" y="402" class="hd" text-anchor="middle" font-size="20">IMAGE</text>
    <text x="472" y="426" class="hd" text-anchor="middle" font-size="20">PREPARER</text>
    <text x="472" y="456" class="mono" text-anchor="middle" font-size="13" fill="#565c63">OCI → rootfs</text>

    <rect x="620" y="360" width="255" height="120" fill="#fbfaf7" stroke="#1b1d20" stroke-width="2.5"/>
    <text x="747" y="402" class="hd" text-anchor="middle" font-size="20">NETWORK</text>
    <text x="747" y="426" class="hd" text-anchor="middle" font-size="20">MANAGER</text>
    <text x="747" y="456" class="mono" text-anchor="middle" font-size="13" fill="#565c63">TAP + VXLAN</text>

    <rect x="895" y="360" width="255" height="120" fill="#fbfaf7" stroke="#1b1d20" stroke-width="2.5"/>
    <text x="1022" y="402" class="hd" text-anchor="middle" font-size="20">VMM</text>
    <text x="1022" y="426" class="hd" text-anchor="middle" font-size="20">MANAGER</text>
    <text x="1022" y="456" class="mono" text-anchor="middle" font-size="13" fill="#565c63">Firecracker API</text>
  </g>

  <!-- bus from executor down to internals -->
  <path d="M985 264 L985 300 L197 300 L197 355" fill="none" stroke="#1b1d20" stroke-width="2.5"/>
  <path d="M472 300 L472 355" fill="none" stroke="#1b1d20" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M747 300 L747 355" fill="none" stroke="#1b1d20" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1022 300 L1022 355" fill="none" stroke="#1b1d20" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="985" y1="300" x2="197" y2="300" stroke="#1b1d20" stroke-width="2.5"/>
  <line x1="197" y1="300" x2="197" y2="355" stroke="#1b1d20" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- band 3: firecracker -> kvm -> microvms -->
  <g class="t" font-size="19" fill="#1b1d20">
    <rect x="895" y="572" width="255" height="96" fill="#e8e6e0" stroke="#1b1d20" stroke-width="2.5"/>
    <text x="1022" y="614" class="hd" text-anchor="middle" font-size="20">FIRECRACKER VMM</text>
    <text x="1022" y="642" class="mono" text-anchor="middle" font-size="13" fill="#565c63">one process per VM</text>
  </g>
  <path d="M1022 480 L1022 566" fill="none" stroke="#1b1d20" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- KVM boundary -->
  <rect x="70" y="560" width="780" height="120" fill="none" stroke="#a33d08" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="90" y="588" class="mono" font-size="14" fill="#a33d08">KVM HARDWARE BOUNDARY</text>

  <!-- microVM containers -->
  <g>
    <rect x="100" y="600" width="220" height="60" fill="url(#corrugate)" stroke="#1b1d20" stroke-width="2.5"/>
    <text x="210" y="637" class="mono" font-size="15" fill="#fbfaf7" text-anchor="middle">microVM web.1</text>

    <rect x="340" y="600" width="220" height="60" fill="url(#corrugate)" stroke="#1b1d20" stroke-width="2.5"/>
    <text x="450" y="637" class="mono" font-size="15" fill="#fbfaf7" text-anchor="middle">microVM web.2</text>

    <rect x="580" y="600" width="220" height="60" fill="url(#corrugate)" stroke="#1b1d20" stroke-width="2.5"/>
    <text x="690" y="637" class="mono" font-size="15" fill="#fbfaf7" text-anchor="middle">microVM web.3</text>
  </g>
  <path d="M895 620 L810 620" fill="none" stroke="#1b1d20" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- footer note -->
  <text x="40" y="746" class="mono" font-size="14" fill="#565c63">Each microVM boots its own Linux kernel; the host kernel is never shared.</text>
</svg>
