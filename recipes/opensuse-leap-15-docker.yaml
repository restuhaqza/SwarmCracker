apiVersion: swarmcracker.io/v1alpha1
kind: GoldenImage
metadata:
  name: opensuse-leap-15-docker
  version: 1.0.0
  description: openSUSE Leap 15 + systemd + Docker (SUSE ecosystem)

spec:
  arch: [amd64, arm64]

  source:
    type: oci
    ref: registry.opensuse.org/opensuse/leap:15.6

  init:
    system: systemd
    bootArgs:
      - systemd.unified_cgroup_hierarchy=1
      - systemd.journald.forward_to_console=1

  kernel:
    profile: guest-runtime-6.1

  runtime:
    name: docker
    storageDriver: overlay2
    cgroupVersion: v2
    install: packages

  disk:
    rootMinSize: 6GiB
    dataDisk:
      size: 20GiB
      mount: /var/lib/docker
      fs: ext4

  network:
    guestCIDR: 172.17.0.0/16

  provision: |
    set -eux

    zypper --non-interactive --gpg-auto-import-keys refresh
    zypper --non-interactive install --no-recommends \
      systemd docker ca-certificates curl iproute2 \
      iptables nftables iputils procps

    systemctl enable docker.service
    systemctl enable serial-getty@ttyS0.service
    systemctl set-default multi-user.target

    echo 'net.ipv4.ip_forward = 1' > /etc/sysctl.d/99-swarmcracker.conf

  seal:
    - truncate -s 0 /etc/machine-id
    - rm -rf /var/cache/zypp/* /var/cache/zypper/*
    - rm -f /etc/ssh/ssh_host_*

  health:
    - command: systemctl is-system-running --wait
      timeout: 120s
    - command: docker info
      timeout: 60s

  verify:
    - name: cgroup2-mounted
      guest: mountpoint -q /sys/fs/cgroup && stat -fc %T /sys/fs/cgroup | grep -q cgroup2
    - name: docker0-exists
      guest: ip link show docker0
