# Prometheus scrape configuration for SwarmCracker
# Drop into your prometheus.yml scrape_configs section.

scrape_configs:
  - job_name: swarmcracker
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets:
          # Manager nodes
          - manager1:8080
          - manager2:8080
          - manager3:8080
          # Worker nodes
          - worker1:8080
          - worker2:8080
          - worker3:8080
        labels:
          cluster: production
          env: prod

  - job_name: swarmcracker-consul
    scrape_interval: 30s
    scrape_timeout: 5s
    consul_sd_configs:
      - server: consul:8500
        services: []
    relabel_configs:
      - source_labels: [__meta_consul_service]
        regex: swarmcracker
        action: keep
      - source_labels: [__meta_consul_address]
        target_label: __address__
        replacement: "${1}:8080"
