version: "2"
linters:
  default: none
  enable:
    - errcheck
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - nilerr
    - noctx
    - prealloc
    - revive
    - staticcheck
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    gocyclo:
      min-complexity: 20
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocyclo
          - gosec
          - noctx
          - prealloc
        path: _test\.go
      - linters:
          - errcheck
          - gocyclo
          - gosec
        path: test/
      - linters:
          - errcheck
          - gosec
        path: pkg/jailer/
      - linters:
          - errcheck
          - gocyclo
          - gosec
        path: pkg/swarmkit/
      - linters:
          - errcheck
          - gosec
        path: pkg/cni/
      - linters:
          - errcheck
          - gocyclo
          - gosec
        path: pkg/image/
      - linters:
          - errcheck
          - gosec
          - noctx
        path: pkg/snapshot/
      - linters:
          - errcheck
          - gocyclo
          - gosec
          - nilerr
        path: pkg/lifecycle/
      - linters:
          - errcheck
          - gosec
        path: pkg/storage/
      - linters:
          - errcheck
          - gosec
        path: pkg/network/
      - linters:
          - errcheck
        path: pkg/executor/
      - linters:
          - errcheck
        path: pkg/health/
      - linters:
          - errcheck
        path: pkg/runtime/
      - linters:
          - gosec
        path: pkg/security/
      - linters:
          - errcheck
          - gocyclo
          - gosec
          - noctx
        path: cmd/swarmcracker/
      - linters:
          - gosec
        path: cmd/swarmd-firecracker/
      - linters:
          - errcheck
          - gosec
          - noctx
        path: cmd/swarmctl/
      - linters:
          - ineffassign
        path: cmd/swarmcracker-cni/
      - linters:
          - staticcheck
        path: cmd/get-join-token/
      - linters:
          - errcheck
        path: pkg/network/testhelpers/
      - linters:
          - ineffassign
        path: test/e2e/
      - linters:
          - staticcheck
        text: 'SA1019: grpc\.Dial is deprecated'
      - linters:
          - staticcheck
        text: 'SA1019: grpc\.With(Insecure|Timeout|Dialer|Block) is deprecated'
      - linters:
          - staticcheck
        text: 'SA1019: skel\.PluginMain is deprecated'
      - linters:
          - staticcheck
        text: 'SA1012: do not pass a nil Context'
      - linters:
          - staticcheck
        text: 'SA9003: empty branch'
      - linters:
          - staticcheck
        text: 'SA4006: this value of'
      - linters:
          - staticcheck
        text: SA5011
      - linters:
          - gocyclo
        path: pkg/network/manager\.go
      - linters:
          - gocyclo
        path: pkg/config/config\.go
      - linters:
          - gocyclo
        path: cmd/swarmctl/main\.go
      - linters:
          - gocyclo
        path: cmd/swarmctl/snapshots\.go
      - linters:
          - gocyclo
        path: cmd/swarmctl/volumes\.go
      - linters:
          - gocyclo
        path: pkg/lifecycle/
      - linters:
          - gocyclo
        path: pkg/runtime/
      - linters:
          - prealloc
        path: pkg/swarmkit/executor\.go
      - linters:
          - prealloc
        path: pkg/storage/
      - linters:
          - prealloc
        path: pkg/image/wrapper\.go
      - linters:
          - noctx
        path: pkg/lifecycle/
      - linters:
          - noctx
        path: pkg/health/
      - linters:
          - ineffassign
        path: pkg/lifecycle/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - _test\.go
